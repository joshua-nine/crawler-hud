<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Floor Builder (GM)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crawler HUD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: HUD-style app shell — sticky header + tab rail, one working column per tab, two-pane Mob Forge. Deliberately single dark navy/gold theme. */
:root{
  --bg:#0a1020; --panel:#101a30; --panel-2:#16223d; --line:#263456; --line-2:#33446d;
  --ink:#e9e6dc; --muted:#98a3bc; --dim:#6c7896;
  --gold:#d8b25a; --gold-hi:#f3d27a; --gold-ink:#1a1405;
  --hb:#d2533e; --ok:#5db487; --warn:#e2a23b; --bad:#e0604b;
  --f-display:"Chakra Petch", "Rajdhani", "Arial Narrow", sans-serif;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold)}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 85%,transparent);padding-top:14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:22px;font-weight:700;color:var(--gold-hi);text-transform:uppercase;letter-spacing:.06em}
.brand .sub{font-size:12px;color:var(--muted)}
.floorpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
.save.ok::before{content:"● ";color:var(--ok)} .save.busy::before{content:"● ";color:var(--warn)} .save.err::before{content:"● ";color:var(--bad)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--gold-hi);border-bottom-color:var(--gold)}
nav.tabs .scope{margin-left:auto;align-self:center;white-space:nowrap;font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold);border-radius:99px;padding:3px 10px}
.copyctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.copyctl select{width:auto;max-width:240px}
nav.tabs .count{font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-left:4px}

/* Controls */
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.2}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{background:var(--gold-hi)}
.btn.ghost{background:none}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;padding:2px 6px;line-height:1}
.x:hover{color:var(--bad)}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
input:hover,select:hover,textarea:hover{border-color:var(--line-2)}
textarea{resize:vertical;min-height:64px;line-height:1.45}
input[type=number]{font-family:var(--f-mono)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f > span{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14px}
.chk input{margin-top:4px;accent-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}

/* Panels */
main{display:grid;gap:18px;margin-top:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel > header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.panel h2{font-size:17px;color:var(--gold-hi);text-transform:uppercase;letter-spacing:.06em}
.panel h3{font-size:15px}
.hbbar{display:flex;gap:4px;flex-wrap:wrap}.hbs{position:relative;width:52px;height:44px;border-radius:6px;border:1px solid hsl(var(--h) 60% 45%);background:hsl(var(--h) 55% 30% / .55);color:#fff;font-family:var(--f-mono);font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0}
.hbs i{position:absolute;bottom:1px;left:0;right:0;font-size:9px;font-style:normal;opacity:.75}.hbs.lost{background:transparent;color:var(--muted);border-style:dashed}.hbs.lost::after{content:"";position:absolute;inset:6px;background:linear-gradient(to top right,transparent 46%,var(--bad,#d9534f) 48%,var(--bad,#d9534f) 52%,transparent 54%)}
.hbs.sm{width:30px;height:26px;font-size:12px}.linkish{background:none;border:0;color:var(--gold-hi);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
tr.hl td{background:rgba(216,178,90,.08)}.sheet-stats input{width:72px}.sheet-ed .f input,.sheet-ed td input[type=text]{min-width:0}
.aibox{border:1px solid #2fd2ff55;background:linear-gradient(180deg,#071a2b,#0b1220);border-radius:10px;padding:12px 14px;font-family:var(--f-mono);color:#bfefff;box-shadow:0 0 18px #2fd2ff22 inset}.aihead{font-size:11px;letter-spacing:.2em;color:#2fd2ff;margin-bottom:6px}
.spcard{display:flex;gap:12px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}.spem{font-size:40px;line-height:1}.spcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.spcols small{color:var(--gold);text-transform:uppercase;letter-spacing:.08em;font-size:11px}.spcols ul{margin:4px 0 0;padding-left:18px;font-size:13px}@media(max-width:560px){.spcols{grid-template-columns:1fr}}
.biscuit{border:1px solid var(--gold);background:rgba(216,178,90,.08);border-radius:10px;padding:10px 12px;margin-top:12px}.biscuit p{margin:4px 0 8px;font-size:14px}
.wz{scroll-margin-top:170px;padding:16px 18px 20px;background:radial-gradient(1200px 500px at 50% 0,#1d2a4a 0,var(--panel,#121a2e) 60%)}
.wztop{display:flex;gap:12px;align-items:flex-start}.wzbans{display:flex;gap:10px;overflow-x:auto;flex:1;padding:4px 2px 10px;scrollbar-width:thin}
.wzban{flex:0 0 auto;width:96px;background:none;border:0;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:0}
.wzban small{font-family:var(--f-display);font-size:13px;opacity:.5}.wzban b{font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--text)}
.wzflag{margin-top:4px;width:62px;height:58px;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;color:#fff;background:linear-gradient(180deg,hsl(var(--h) 55% 42%),hsl(var(--h) 55% 22%));clip-path:polygon(0 0,100% 0,100% 82%,50% 100%,0 82%);opacity:.55;transition:.15s}
.wzban.on .wzflag{opacity:1;transform:translateY(2px);box-shadow:0 0 0 2px var(--gold) inset}.wzban.ok .wzflag{opacity:.95}.wzban.on b{color:var(--gold-hi)}
.wzside{display:flex;flex-direction:column;gap:8px;align-items:flex-end;padding-top:6px}
.wzname{margin:4px auto 14px;max-width:420px;text-align:center;font-family:var(--f-display);font-size:24px;letter-spacing:.06em;color:var(--gold-hi);padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.wzgrid{display:grid;grid-template-columns:270px minmax(0,1fr) 230px;gap:18px;align-items:start}
.wzleft{display:grid;gap:6px;max-height:620px;overflow:auto;padding-right:4px}.wzlist{display:grid;gap:6px}
.wzopt{display:flex;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;color:var(--text)}
.wzopt b{display:block;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:12px}.wzopt i{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.wzopt.on{border-color:var(--gold);background:rgba(216,178,90,.12)}.wzopt:hover{border-color:var(--line-2)}
.orb{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:#fff;background:radial-gradient(circle at 35% 30%,hsl(var(--h) 75% 62%),hsl(var(--h) 60% 26%));box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.wzopt.on .orb{box-shadow:0 0 0 2px var(--gold),0 0 12px hsl(var(--h) 80% 50% / .6)}
.wzsub{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.wzsub button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:4px 8px;font-size:12px;cursor:pointer}.wzsub button.on{color:var(--gold-hi);border-color:var(--gold)}.wzsub button.ok::after{content:" ✓";color:#7bd88f}
.wzh{font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;font-size:22px;margin:0 0 6px;color:var(--text)}.wzcenter p{line-height:1.55}
.wzpills{display:flex;flex-wrap:wrap;gap:6px}.wzpills span,.wzpills button{font-size:12px;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text)}.wzpills.click button{cursor:pointer}.wzpills button.on{border-color:var(--gold);color:var(--gold-hi)}
.wzskills{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:6px}.wzskills button{text-align:left;cursor:pointer;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text)}
.wzskills button b{display:block}.wzskills button span{font-size:12px;color:var(--muted)}.wzskills button.on{border-color:var(--gold);background:rgba(216,178,90,.14)}
.wzstats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}.wzstat{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;display:grid;gap:6px;background:rgba(255,255,255,.03)}
.wzstat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.wzstat b{font-size:24px}.wzstat select{text-align:center;font-size:18px}.wzstat>span{color:var(--gold-hi)}.wzstat.sug{border-color:var(--gold)}
.wzbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}.wzbig>div{border:1px solid var(--line);border-radius:10px;padding:12px;background:rgba(255,255,255,.03);display:grid;gap:4px}
.wzbig small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.wzbig b{font-family:var(--f-mono);font-size:24px;color:var(--gold-hi)}.wzbig i{font-style:normal;font-size:12px;color:var(--muted)}
.wzport{text-align:center;border-left:1px solid var(--line);padding-left:16px;position:sticky;top:10px}.crest{width:130px;height:150px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.wzpname{font-family:var(--f-display);letter-spacing:.06em;color:var(--gold-hi);margin-top:6px}.wzmini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}.wzmini div{display:grid;font-size:10px;color:var(--muted)}.wzmini b{font-size:15px;color:var(--text)}.wzmini i{font-style:normal;color:var(--gold-hi)}
@media (max-width:900px){.wzgrid{grid-template-columns:1fr}.wzport{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px;position:static;order:3}.wzport .crest{width:70px;height:80px}.wzleft{max-height:none;order:2}.wzcenter{order:1}.wz{scroll-margin-top:20px}.wzstats{grid-template-columns:repeat(3,1fr)}.wztop{flex-direction:column}.wzside{flex-direction:row;align-self:flex-end}}
.itm{border-top:3px solid var(--line-2)}.box-bronze{--bx:#c08a55}.box-silver{--bx:#c9d1dc}.box-gold{--bx:var(--gold)}.box-platinum{--bx:#8fd6e6}.box-legendary{--bx:#c79bff}.itm[class*="box-"]{border-top-color:var(--bx)}.pill.bx{color:var(--bx);border-color:var(--bx)}tr.done td{opacity:.55}
.tip{font-size:13px;color:var(--muted);border-left:2px solid var(--gold);padding:2px 0 2px 10px;margin:0}
.banner{background:#2a2110;border:1px solid #5a4620;color:var(--gold-hi);border-radius:var(--r);padding:8px 12px;font-size:13px}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:860px){.cols{grid-template-columns:1fr}}

/* Rules readout */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rules > div{background:var(--panel-2);padding:10px 12px}
.rules .k{font-family:var(--f-display);text-transform:uppercase;font-size:11px;letter-spacing:.1em;color:var(--muted)}
.rules .v{font-family:var(--f-mono);font-size:18px;color:var(--gold-hi);font-weight:600}
.rules .n{font-size:12px;color:var(--dim)}

/* Clock */
.clock{display:grid;gap:10px}
.clock .readout{font-family:var(--f-mono);font-size:34px;font-weight:600;color:var(--gold-hi);line-height:1}
.clock .readout small{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.meter{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.meter > i{display:block;height:100%;background:linear-gradient(90deg,var(--hb),var(--gold))}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.planned{color:var(--muted)} .pill.prepped{color:var(--gold-hi);border-color:#6b5726}
.pill.played{color:var(--ok);border-color:#2c5a45} .pill.wrecked{color:var(--bad);border-color:#6a2e26}
.pill.warn{color:var(--warn);border-color:#6b4f1e} .pill.okp{color:var(--ok);border-color:#2c5a45}

/* Cards list */
.cardlist{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.card > .head{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.card > .head h3{font-size:16px;margin-right:auto;min-width:0;overflow-wrap:anywhere}
.card.open{border-color:var(--gold)}
.card > .body{padding:4px 12px 14px;display:grid;gap:12px;border-top:1px solid var(--line)}
.prog{display:flex;gap:2px}
.prog i{width:7px;height:12px;border-radius:1px;background:var(--line-2)}
.prog i.on{background:var(--gold)}
details.sec{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
details.sec > summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::before{content:"▸";color:var(--gold);font-size:12px}
details.sec[open] > summary::before{content:"▾"}
details.sec > summary b{font-family:var(--f-display);font-weight:600;letter-spacing:.04em}
details.sec > summary .hint{font-size:12px;color:var(--dim)}
details.sec > summary .filled{margin-left:auto;font-size:11px;color:var(--ok)}
details.sec > .in{padding:0 12px 12px;display:grid;gap:8px}
.li{display:flex;gap:6px;align-items:flex-start}
.li > :first-child{flex:1;min-width:0}
.tbl{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-family:var(--f-display);text-transform:uppercase;font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);font-weight:600}
table.t td{padding:4px 6px;vertical-align:top;border-bottom:1px solid var(--line)}
table.t td.d{font-family:var(--f-mono);color:var(--gold);width:32px;padding-top:11px}
table.t input,table.t select,table.t textarea{min-width:110px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer;background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.addbook{display:flex;flex-wrap:wrap;gap:6px}
.empty{border:1px dashed var(--line-2);border-radius:8px;padding:18px;text-align:center;color:var(--muted)}

/* Mob forge */
.forge{display:grid;gap:18px;grid-template-columns:220px minmax(0,1fr) minmax(0,400px)}
@media (max-width:1060px){.forge{grid-template-columns:200px minmax(0,1fr)} .forge .preview{grid-column:1/-1}}
@media (max-width:700px){.forge{grid-template-columns:1fr}}
.moblist{display:grid;gap:4px;align-content:start}
.moblist button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:none;border:1px solid transparent;border-radius:var(--r);padding:7px 9px;cursor:pointer}
.moblist button:hover{border-color:var(--line-2)}
.moblist button[aria-current="true"]{background:var(--panel-2);border-color:var(--gold)}
.moblist .lv{font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.moblist .kind{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stats label{text-align:center}
.stats .mod{font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.pts{font-family:var(--f-mono);font-size:13px}
.pts.over{color:var(--bad)} .pts.left{color:var(--warn)} .pts.even{color:var(--ok)}
.atk{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--bg)}
.atk .calc{font-family:var(--f-mono);font-size:13px;color:var(--gold-hi)}
.warns{display:grid;gap:4px;font-size:13px}
.warns div{color:var(--warn)} .warns div::before{content:"▲ ";font-size:10px}
.warns .good{color:var(--ok)} .warns .good::before{content:"✓ "}

/* Stat block (book format) */
.sb{background:#f1ead7;color:#1b1a16;border-radius:8px;padding:14px;font-size:13.5px;box-shadow:0 0 0 1px #c9b98d inset;min-width:0}
.sb .nm{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1}
.sb .ty{font-style:italic;color:#4d4635;margin-bottom:8px}
.sb .hb{display:grid;gap:2px;margin:6px 0 10px}
.sb .hb .cells{display:grid;gap:2px}
.sb .hb .cell{background:var(--hb);color:#fff;text-align:center;font-family:var(--f-mono);font-size:11px;padding:2px 0;border-radius:2px}

 1:{name:"First Floor (Tutorial)",days:5,janitor:"",

   powerPlayers:[{name:"Rosie Q",want:"Get rescued; believes Derrick is a good boy at heart. Can send chat messages from the jar but can't receive them.",live:"Knows the Boss's weakness"},

const DEBUFFS=[["Blood Trail","1d6+F each round until bandaged"],["Burned","1d10+F Fire each round; DEX check to put out"],["Drowning","1d6+F each round until head is above water"],["Enraged","only Attack and Move for 2 rounds"],["Fatigued","−1 to all Checks, Move halved"],["Held","no Move; attacks against have Advantage"],["Minor Injury","−2 to all Checks"],["Major Injury","−5 to all Checks"],["Muted","can't speak or cast Spells"],["Poisoned","1d8+F Poison each round until antidote"],["Paralyzed","no Actions until end of next round"],["Queasy","next rolled Action at Disadvantage"],["Sepsis","Staggered and 1d10+F Poison each round"],["Shocked","lose next Action"],["Staggered","next Action can't be Move; attack at Disadvantage"],["Stiff Legs","no 10ft Steps"],["Stunned","Disadvantage on next Check"],["Take Down","knocked prone"],["Terrified","no Move; attacks at Disadvantage"],["The Taint","can't be healed"],["Woozy","no DEX Mod on Attack or Evade"],["Wrapped","head engulfed; escape with STR-opposed check"]];

function statMod(v){v=+v||0;if(v<=0)return 0;if(v<=2)return 1;if(v<=5)return 2;if(v<=9)return 3;if(v<=19)return 4;if(v<=49)return 5;if(v<=99)return 6;if(v<=149)return 7;if(v<=199)return 8;if(v<=299)return 9;return 10}

  const i=rowIdxForFloor(F);
  if(["Province","Country","Floor"].includes(tier)){const r=LEVEL_ROWS[Math.min(i+2,LEVEL_ROWS.length-1)];return [r.min,r.max]}

  if(tier==="Neighborhood")return [r.min,r.min+third-1];

  return [r.min+2*third,r.max];
}

async function flush(id){

/* ===================== COPY BETWEEN FLOORS ===================== */
function floorOpts(f){const others=Object.values(S.floors).filter(x=>x.id!==f.id).sort((a,b)=>a.number-b.number);
  return others.map(x=>`<option value="${x.id}">Floor ${esc(x.number)} · ${esc(x.name)}</option>`).join("")+`<option value="new">+ New Floor ${(+f.number||1)+1}</option>`}
function copyCtl(kind,i){const f=F();const lbl={nb:"Neighborhood",q:"Quest",mob:"stat block"}[kind];
  return `<div class="copyctl"><select id="cp-${kind}-${i}" aria-label="Copy ${lbl} to floor">${floorOpts(f)}</select><button class="btn sm" data-act="copyTo" data-kind="${kind}" data-i="${i}">Copy ${lbl} to floor</button></div>`}
function targetFloor(val,src){if(val&&S.floors[val])return S.floors[val];
  const nf=blankFloor((+src.number||1)+1);nf.partySize=src.partySize;S.floors[nf.id]=nf;return nf}
function copier(src,tgt){const map={};
  const mob=id=>{if(!id)return "";if(map[id])return map[id];const m=src.mobs.find(x=>x.id===id);if(!m)return "";
    const have=tgt.mobs.find(x=>x.copiedFrom===id||x.id===id);if(have)return map[id]=have.id;
    const c=JSON.parse(JSON.stringify(m));c.copiedFrom=id;c.id=uid();c.floor=+tgt.number;tgt.mobs.push(c);return map[id]=c.id};
  const item=x=>{const c=JSON.parse(JSON.stringify(x));c.id=uid();c.status="planned";c.mobs=(c.mobs||[]).map(mob).filter(Boolean);c.boss=mob(c.boss);return c};
  return {mob,item}}
function copyTo(kind,i){const src=F(),sel=$(`#cp-${kind}-${i}`),tgt=targetFloor(sel?.value,src),cp=copier(src,tgt);let what;
  if(kind==="nb"){const n=cp.item(src.neighborhoods[i]);tgt.neighborhoods.push(n);what=n.name}
  else if(kind==="q"){const q=cp.item(src.quests[i]);tgt.quests.push(q);what=q.name}
  else{cp.mob(src.mobs[i].id);what=src.mobs[i].name}
  scheduleSave(tgt.id);renderShell();renderMain();const ns=$(`#cp-${kind}-${i}`);if(ns)ns.value=tgt.id;toast(`Copied ${what} to Floor ${tgt.number}${kind==="mob"?" (+F now uses "+tgt.number+")":""}`)}
function copyFloor(n){const src=F(),nf=JSON.parse(JSON.stringify(src));nf.id="f"+uid();nf.number=Math.max(1,+n||src.number+1);
  const b=BOOK[nf.number];nf.name=src.name+" (copy)";nf.clockHours=(+nf.collapseDays||8)*24;
  const map={};nf.mobs.forEach(m=>{const o=m.id;m.id=uid();m.copiedFrom=o;m.floor=nf.number;map[o]=m.id});
  [...nf.neighborhoods,...nf.quests].forEach(x=>{x.id=uid();x.status="planned";x.mobs=(x.mobs||[]).map(id=>map[id]).filter(Boolean);x.boss=map[x.boss]||""});
  nf.stairwells.forEach(s=>s.status="Hidden");nf.prep={};(nf.loot||[]).forEach(l=>l.given=false);
  S.floors[nf.id]=nf;S.cur=nf.id;S.tab="overview";S.confirm=null;scheduleSave(nf.id);renderAll();toast(`Copied to Floor ${nf.number}. You're now on the copy.`)}

  return `<div class="rules">
   <div><div class="k">Mob levels</div><div class="v">${r.min}–${r.max}</div><div class="n">Table 51</div></div>
   <div><div class="k">Main attack dice</div><div class="v">${r.dice}d</div><div class="n">−1d for area or rider effects</div></div>

/* ===================== MOB MATH ===================== */
function mobCalc(m){
  const L=Math.max(1,+m.level||1),Fl=+m.floor||F()?.number||1,isBoss=m.kind==="Boss";
  const base=isBoss?5:1,spl=isBoss?(BOSS_TIERS[m.tier]?.spl||3):3;
  const budget=base*5+spl*L;
  const spent=STATS.reduce((a,s)=>a+(+m.stats?.[s]||0),0);
  const mods=Object.fromEntries(STATS.map(s=>[s,statMod(m.stats?.[s])]));
  const slots=isBoss?(BOSS_TIERS[m.tier]?.hb||10)+Fl:Math.min(L,10);
  const pcts=[];for(let i=1;i<=slots;i++)pcts.push(Math.round(100*i/slots));
  const row=rowForLevel(L);
  const dr=(m.homeFloor?+m.homeFloor:Fl)+(+m.drAdj||0);
  const attacks=(m.attacks||[]).map(a=>{const mod=mods[a.stat]||0;const n=Math.max(1,row.dice-(a.area?1:0)-(a.rider?1:0));
    return {...a,toHit:10+mod,dmg:`${n}d${a.die}${mod?"+"+mod:""}`}});
  const warns=[];
  const fi=rowIdxForFloor(Fl),fr=LEVEL_ROWS[fi];
  if(isBoss){const[a,b]=bossRange(Fl,m.tier);if(L<a||L>b)warns.push(`Book guidance for a Floor ${Fl} ${m.tier} Boss is Lv ${a}–${b}.`);else warns.push({good:`Level fits a Floor ${Fl} ${m.tier} Boss (${a}–${b}).`})}
  else if(L<fr.min)warns.push(`Below Floor ${Fl}'s typical range (${fr.min}–${fr.max}). Run them in larger numbers.`);
  else if(L>fr.max)warns.push(`Above Floor ${Fl}'s typical range (${fr.min}–${fr.max}). A deadly surprise; keep groups small.`);
  else warns.push({good:`Level fits Floor ${Fl} Mobs (${fr.min}–${fr.max}).`});
  if(spent>budget)warns.push(`${spent-budget} stat points over budget.`);
  else if(spent<budget)warns.push(`${budget-spent} stat points left to assign.`);
  if((m.attacks||[]).some(a=>a.rider&&!a.effect))warns.push("An attack is flagged with a rider effect but no effect text.");
  return {L,Fl,isBoss,budget,spent,mods,slots,pcts,row,dr,attacks,warns};
}
function statBlock(m,c){
  c=c||mobCalc(m);
  const cols=Math.min(c.slots,10),rows=Math.ceil(c.slots/cols);
  const sz=SIZES.find(s=>s[0]===+m.size)||SIZES[3];
  const kindLine=c.isBoss?`${esc(m.tier)} Boss`:(m.kind==="Elite"?"Elite":"Mob");
  return `<div class="sb">
   ${m.announce?`<div class="ann"><b>${esc(m.name)}. Level ${c.L}${c.isBoss?` ${esc(m.tier)} Boss!`:"."}</b><br>${esc(m.announce)}</div>`:""}
   ${m.img?`<img class="sbimg" src="${esc(m.img)}" alt="">`:""}<div class="nm">${esc(m.name)||"Unnamed"}</div>
   <div class="ty">${kindLine}; ${sz[1]} (${sz[0]}), ${esc(m.type)}</div>
   <div class="hb" aria-label="Health bar: ${c.slots} slots">
    <div class="cells" style="grid-template-columns:repeat(${cols},1fr)">${c.pcts.map(()=>`<span class="cell">${c.mods.CON}</span>`).join("")}</div>
    ${rows===1?`<div class="pc" style="grid-template-columns:repeat(${cols},1fr)">${c.pcts.map(p=>`<span>${p}%</span>`).join("")}</div>`:`<div class="pc" style="text-align:left">${c.slots} slots × ${c.mods.CON} · each ≈ ${Math.round(100/c.slots)}%</div>`}
   </div>
   <table><tr><th>Level</th><th>Surprise</th><th>Evade</th><th>Move</th><th>DR</th></tr>
    <tr><td>${c.L}</td><td>${plusF(10+c.mods.INT)}</td><td>${plusF(10+c.mods.DEX)}</td><td>${esc(m.move)}</td><td>${c.dr}</td></tr></table>
   <table><tr>${STATS.map(s=>`<th>${s}</th>`).join("")}</tr><tr>${STATS.map(s=>`<td>${+m.stats?.[s]||0} (+${c.mods[s]})</td>`).join("")}</tr></table>
   ${(m.traits||[]).filter(t=>t.name||t.text).map(t=>`<div class="attack"><b><i style="display:inline;color:inherit">${esc(t.name)}.</i></b> ${esc(t.text)}</div>`).join("")}
   ${c.attacks.map(a=>`<div class="attack"><b>${esc(a.name)}:</b> ${plusF(a.toHit)} to hit, ${a.dmg} ${esc(a.type)}${a.range?`, ${esc(a.range)} range`:""}${a.area?" (area)":""}${a.effect?`<i>${esc(a.effect)}</i>`:""}</div>`).join("")}
   ${c.isBoss?`<div class="attack"><i>Takes 1 action per crawler, even after one dies.</i></div>`:""}
   ${m.notes?`<div class="notes"><b>Notes:</b> ${esc(m.notes)}</div>`:""}
   ${(m.clues||[]).filter(x=>x.trim()).length?`<div class="notes"><b>Clues:</b><ul style="margin:2px 0 0;padding-left:18px">${m.clues.filter(x=>x.trim()).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
  </div>`;
}

function spread(m,k){
  const c=mobCalc(m),budget=c.budget,base=c.isBoss?5:1,extra=budget-base*5;
  const W={brute:{STR:4,CON:3,DEX:2,INT:.5,CHA:.5},skirm:{DEX:4,STR:2,CON:2,INT:1.5,CHA:.5},caster:{INT:4,DEX:2,CON:2,CHA:1.5,STR:.5},face:{CHA:4,INT:2.5,DEX:2,CON:1,STR:.5},even:{STR:1,INT:1,CON:1,DEX:1,CHA:1}}[k];
  const tw=Object.values(W).reduce((a,b)=>a+b,0);let used=0;const out={};
  STATS.forEach(s=>{out[s]=base+Math.floor(extra*W[s]/tw);used+=out[s]-base});
  let left=extra-used;const order=STATS.slice().sort((a,b)=>W[b]-W[a]);let j=0;while(left>0){out[order[j%5]]++;left--;j++}
  m.stats=out;
}

function sheetText(f){
  const L=[],mob=id=>f.mobs.find(m=>m.id===id);
  L.push(`# Floor ${f.number}: ${f.name}`);if(f.theme)L.push(f.theme);
  L.push(`Collapse: ${f.collapseDays} days (${f.clockHours}h left) | Janitor: ${f.janitor||"-"}`);
  L.push(`Stairwells: ${f.stairwells.map(s=>`${s.where} (${s.status||"Hidden"})`).join("; ")||"none set"}`);
  f.neighborhoods.forEach(n=>{L.push(`\n## ${n.name} [${n.status}]`);if(n.summary)L.push(n.summary);
    n.strongStarts.filter(x=>x.trim()).forEach(x=>L.push(`- Start: ${x}`));
    if(n.mobs.length)L.push(`Mobs: ${n.mobs.map(id=>mob(id)?.name).join(", ")}`);
    if(n.boss)L.push(`Boss: ${mob(n.boss)?.name}`);
    n.traps.forEach(t=>L.push(`- Trap: ${t.name} (${t.detect}) ${t.effect||""}`));
    n.grinding.forEach((g,i)=>g.trim()&&L.push(`  ${i+1}. ${g}`))});
  f.quests.forEach(q=>{L.push(`\n## Quest: ${q.name} [${q.status}]`);if(q.goal)L.push(`Goal: ${q.goal}`);q.stages.forEach(s=>L.push(`- ${s.name}: ${s.what} -> ${s.brk}`))});
  if((f.loot||[]).length){L.push(`\n## Loot`);f.loot.forEach(l=>L.push(`- ${l.given?"[x] ":"[ ] "}${l.n} (${l.b} box, Gear Slot: ${l.s}${l.where?", "+l.where:""}): ${l.fx}`))}
  f.mobs.forEach(m=>{const c=mobCalc(m);L.push(`\n### ${m.name} (${m.kind==="Boss"?m.tier+" Boss":m.kind}, Lv ${c.L})`);
    L.push(`Surprise ${10+c.mods.INT}+F | Evade ${10+c.mods.DEX}+F | Move ${m.move} | DR ${c.dr} | HB ${c.slots}x${c.mods.CON}`);
    L.push(STATS.map(s=>`${s} ${m.stats[s]} (+${c.mods[s]})`).join(" | "));
    c.attacks.forEach(a=>L.push(`${a.name}: ${a.toHit}+F to hit, ${a.dmg} ${a.type}${a.range?", "+a.range:""}${a.effect?" — "+a.effect:""}`));
    if(m.notes)L.push(`Notes: ${m.notes}`)});
  return L.join("\n");
}

function lichBoss(L,tier,fl){
  if(L.kind==="Mob"){const m=blankMob("Mob"),r=LEVEL_ROWS[rowIdxForFloor(fl)];const lv=L.lv==="low"?r.min:L.lv==="high"?r.max:Math.round((r.min+r.max)/2);
    Object.assign(m,{name:L.name,level:lv,floor:fl,size:L.size,type:L.type,move:L.move||"20+S",drAdj:L.drAdj||0,announce:`${L.name}. ${L.concept}`,
      attacks:L.attacks.map(([name,stat,die,type,range,area,rider,effect])=>({name,stat,die,type,range,area:!!area,rider:!!rider,effect})),
      traits:(L.traits||[]).map(([name,text])=>({name,text})),clues:L.clues.slice(),notes:L.source});spread(m,L.role);return m}
  const m=blankMob("Boss");tier=tier||L.tier||"City";const[a,b]=bossRange(fl,tier);const home=!!L.source;
  Object.assign(m,{name:L.name,tier,level:Math.round((a+b)/2),floor:fl,size:L.size,type:L.type,move:L.move||"20+S",drAdj:L.drAdj||0,
    announce:home?`${L.name}. ${L.concept}`:`${L.name}. A ${L.origin} lich. ${L.concept}`,
    attacks:L.attacks.map(([name,stat,die,type,range,area,rider,effect])=>({name,stat,die,type,range,area:!!area,rider:!!rider,effect})),
    traits:(L.traits||[]).map(([name,text])=>({name,text})),
    clues:L.clues.slice(),notes:home?`${L.source}. Bosses take 1 action per crawler.`:`Converted from Lich Codex p.${L.page} (5e). Bosses take 1 action per crawler; it has a soul vessel (spirit jar) and reforms unless it's dealt with.`});
  spread(m,L.role);return m;
}

const HOMEBREW=[{"name": "The Hunger", "origin": "Apex Wendigo", "source": "Your homebrew (5e, converted)", "page": "", "role": "brute", "size": 5, "type": "Monstrosity (Apex Wendigo)", "tier": "City", "move": "50+S, climb 40", "drAdj": 1, "concept": "An apex wendigo that never needs to eat but never stops. It raises the dead as Wendigos, speaks in the voices of the people it ate, and starves anyone who stands too close.", "attacks": [["Claws", "STR", 10, "Slashing + Necrotic", "10ft", 0, 0, "Attacks with two Claws and one Bite each turn."], ["Bite", "STR", 10, "Piercing + Necrotic", "5ft", 0, 1, "On a hit, the target makes a CON Stat Check (Difficulty 10 + its CON mod + F) or gains The Taint until a long rest."], ["Hunger's Howl", "CHA", 10, "Psychic", "Burst 60ft", 1, 1, "Recharges on a d6 roll of 5–6. On a hit, the target gains the Terrified Debuff. Its own Wendigos are immune."]], "traits": [["Aura of Starvation", "A crawler that starts its turn within 20 ft makes a WIS Stat Check (Difficulty 10 + its CHA mod + F) or is Starved until its next turn: Disadvantage on STR and CON checks and it can't be healed. Fail by 10 or more and it also gains Terrified."], ["Regeneration", "Regains 1 HB slot at the start of each of its turns. Fire damage shuts this off for its next turn."], ["Vital Feast", "Against a Held, Paralyzed or downed crawler: one bite for full damage dice as Piercing + Necrotic. If it kills, The Hunger regains 3 HB slots and has Advantage until its next turn."], ["Create Wendigo (1/day) and Spawn", "Touches a humanoid corpse or downed crawler, which rises as a Wendigo Mob under its control after a minute. A downed crawler resists with a CON check each round for 3 rounds. Up to 6 Wendigos; it can also raise one from a corpse within 30 ft whenever it has fewer than 6."], ["Wendigo Sovereign", "Commands its Wendigos telepathically within a mile. If it dies, they go free-willed and most flee in terror."], ["Voice of the Devoured", "Mimics anyone it or its W ice) at the start of each of its turns while Held. Up to four crawlers Held at once. Three Tentacles per turn, or one Tentacle and Mind Theft."], ["Mind Blast", "INT", 10, "Psychic", "Cone 60ft", 1, 1, "Recharges on a d6 roll of 5–6. On a hit, INT check or Stunned for a minute (repeat the check each round)."], ["Psionic Assault", "INT", 10, "Psychic", "120ft", 0, 0, "One target; INT check or full damage. Use it between crawlers' turns."]], "traits": [["Mind Theft", "A crawler within 120 ft makes an INT check (Difficulty 10 + its INT mod + F) or the Mind Harvest steals one Skill, class ability, race ability or feat with limited uses. It uses the ability as its own and the crawler loses a use. Holds up to ten."], ["Learn From You", "When a crawler uses a class ability, race ability or Skill it can see, it studies it. Studying the same one twice gives it a permanent copy."], ["Creature Sense", "Knows the distance and direction of every thinking creature within 5 miles. Mind-shielding magic hides you."], ["Telepathic Hub", "Talks telepathically with up to ten creatures at once and can link them to each other."], ["Many Minds", "Concentrates on up to three Spells at once, checking each separately."], ["Psionic Spellcaster", "Casts with no components: detect thoughts and levitate at will, plus heavy hitters like counterspell, shield, hypnotic pattern, hold monster, telekinesis, wall of force, disintegrate, forcecage, teleport, maze, mind blank, foresight and psychic scream. Map these to your table's Spells."], ["Magic Resistance", "Advantage against Spells and magical effects. Immune to Psychic; can't be blinded, charmed or frightened."]], "clues": ["Mind-shielding effects hide you from its Creature Sense.", "Kill it and every stolen ability comes home."]}];

ngs a rope of light between them (within 30 ft) for an hour."},{"n":"Lighthouse Lantern","s":"Tool","b":"Bronze","src":1,"p":10,"fx":"Flashes red when your vessel gets within 120 ft of land or rocks."},{"n":"Lipstick of the Fickle","s":"Consumable","b":"Bronze","src":1,"p":10,"fx":"10 uses; your lip color shifts every hour for a day."},{"n":"Map of Destination","s":"Misc","b":"Bronze","src":1,"p":10,"fx":"Point at two spots; it draws the shortest route. One use."},{"n":"Map of Location","s":"Misc","b":"Bronze","src":1,"p":10,"fx":"Once a day, shows your current location as a red dot."},{"n":"Map of Revelation","s":"Misc","b":"Bronze","src":1,"p":10,"fx":"Unroll it and it maps the area within 10 miles, filling in as you move. (In the dungeon: maps the current Neighborhood.)"},{"n":"Mask of the Monster","s":"Face","b":"Bronze","src":1,"p":10,"fx":"Once a day, disguise yourself as a specific Mob type (roll it)."},{"n":"Miniature Mimic","s":"Container","b":"Bronze","src":1,"p":10,"fx":"Small chest that bites (1d4+F Piercing) anyone opening it without the command word."},{"n":"Mug of Clear Water","s":"Tool","b":"Bronze","src":1,"p":10,"fx":"Turns any normal liquid poured in into clean water."},{"n":"Nail Paints of Marking","s":"Consumable","b":"Bronze","src":1,"p":10,"fx":"For 10 days, scratching your nails leaves a colored trail that lasts a day."},{"n":"Parchment of Imitation","s":"Consumable","b":"Bronze","src":1,"p":10,"fx":"Press it on a page to make a perfect copy (no magic). One use."},{"n":"Pearl of Illusions","s":"Consumable","b":"Bronze","src":1,"p":11,"fx":"Throw it to create a silent illusory object up to a 5 ft cube for an hour. Once per long rest."},{"n":"Perpetual Ink Pen","s":"Tool","b":"Bronze","src":1,"p":11,"fx":"Never runs out; change ink color by naming it."},{"n":"Pigeon Pointer","s":"Tool","b":"Bronze","src":1,"p":11,"fx":"Balance it on your finger and it points north."},{"n":"Pop-up Tent","s":"Tool","b":"Bronze","src":1,"p":11,"fx":"Bundle that springs into a two-person tent on command."},{"n":"Pot of Purity","s":"Tool","b":"Bronze","src":1,"p":11,"fx":"Food cooked in it is purified (up to six meals a day)."},{"n":"Prismatic Paint","s":"Tool","b":"Bronze","src":1,"p":11,"fx":"A pint of paint in any color you name; refills daily."},{"n":"Retuning Fork","s":"Tool","b":"Bronze","src":1,"p":11,"fx":"Instantly tunes an instrument."},{"n":"Ring of the Hunter","s":"Accessory","b":"Bronze","src":1,"p":11,"fx":"3 charges: conjure a ghostly shortbow with endless arrows for a minute. Recharges daily."},{"n":"Ring of the Tiger","s":"Accessory","b":"Bronze","src":1,"p":11,"fx":"Pop out metal claws for a minute; unarmed strikes deal Slashing damage and count as magic."},{"n":"Sarong of Drying","s":"Legs","b":"Bronze","src":1,"p":11,"fx":"Your clothes stay dry even underwater."},{"n":"Shadow Dagger","s":"Weapon","b":"Bronze","src":1,"p":11,"fx":"Turns invisible in flight and reappears where it lands."},{"n":"Singing Sword","s":"Weapon","b":"Bronze","src":1,"p":12,"fx":"Rapier that doubles as a fiddle bow; after a hit, it can play music for a minute."},{"n":"Sleep-tight Bathing Salts","s":"Consumable","b":"Bronze","src":1,"p":12,"fx":"A one-hour soak makes your next long rest take half the time."},{"n":"Slithering Hook","s":"Tool","b":"Bronze","src":1,"p":12,"fx":"Grappling hook with 60 ft of self-tying rope; Advantage to throw it."},{"n":"Smuggler's Chair","s":"Container","b":"Bronze","src":1,"p":12,"fx":"Chair with an illusion-hidden 1 cubic ft compartment."},{"n":"Spectacles of Recollection","s":"Face","b":"Bronze","src":1,"p":12,"fx":"Once per long rest, perfectly recall any 5 minutes you saw in the last month."},{"n":"Staff of Moons","s":"Weapon","b":"Bronze","src":1,"p":12,"fx":"Staff with a color-changing light orb (10 ft bright light)."},{"n":"Staff of Spores","s":"Weapon","b":"Bronze","src":1,"p":12,"fx":"Staff that casts dancing lights at will."},{"n":"Stellar Spectacles","s":"Face","b":"Bronze","src":1,"p":12,"fx":"See constellations outlined; Advantage to navigate by the stars (useless underground, which is funny)."},{"n":"Still-beating Heart","s":"Accessory","b":"Bronze","src":1,"p":12,"fx":"The first time you'd fail a Dying roll, it succeeds instead; then the heart crumbles."},{"n":"Sword of Devotion","s":"Weapon","b":"Bronze","src":1,"p":12,"fx":"Its tassel binds to your arm; you can't be disarmed while it's drawn."},{"n":"Thieves' Blade","s":"Weapon","b":"Bronze","src":1,"p":12,"fx":"Dagger that turns into a set of lockpicks and back."},{"n":"Tippity Tap Shoes","s":"Feet","b":"Bronze","src":1,"p":13,"fx":"Advantage on dance Performance checks."},{"n":"True-seeking Dart","s":"Consumable","b":"Bronze","src":1,"p":13,"fx":"Thrown at a target within 60 ft, it always hits for 1d4+F Piercing. One use."},{"n":"Un-breakable Teapot","s":"Tool","b":"Bronze","src":1,"p":13,"fx":"Repairs itself on command."},{"n":"Unending Scroll","s":"Misc","b":"Bronze","src":1,"p":13,"fx":"A scroll of infinite length."},{"n":"Wand of Bubbles","s":"Tool","b":"Bronze","src":1,"p":13,"fx":"7 charges: colored bubbles, shaped bubbles, or a bubble shower. Recharges 1d6+1 daily."},{"n":"Wand of Colors","s":"Tool","b":"Bronze","src":1,"p":13,"fx":"7 charges: recolor an object up to a 5 ft cube for an hour."},{"n":"Wand of Subtitles","s":"Tool","b":"Bronze","src":1,"p":13,"fx":"3 charges: a creature's speech in one language shows as subtitles in front of you for 10 minutes."},{"n":"Wand of Swaying","s":"Tool","b":"Bronze","src":1,"p":13,"fx":"7 charges: make plants within 30 ft sway as if in wind."},{"n":"Wand of the Magician","s":"Tool","b":"Bronze","src":1,"p":14,"fx":"3 charges: turn the wand into a bouquet of flowers for a minute."},{"n":"Wax Seal of Protection","s":"Tool","b":"Bronze","src":1,"p":14,"fx":"Once a day, seal a letter so only its addressee can open it."},{"n":"Whistle of the Stallion","s":"Tool","b":"Bronze","src":1,"p":14,"fx":"Once a day, summon a riding horse for an hour."},{"n":"Wind-up Beacon","s":"Tool","b":"Bronze","src":1,"p":14,"fx":"Projects a 100 ft pillar of light visible a mile away for 10 minutes."},{"n":"Anaidni's Whip","s":"Weapon","b":"Silver","src":2,"p":3,"fx":"Whip, +1 to hit and damage. Once a day, lash onto something for Advantage on a climb or jump check."},{"n":"Mjoln Hammer","s":"Weapon","b":"Silver","src":2,"p":3,"fx":"Light hammer, +1 to hit and damage. Once a day, strike a surface for a thunderclap heard 1d4 miles away."},{"n":"Forget-me-not","s":"Weapon","b":"Silver","src":2,"p":3,"fx":"Maul, +1 to hit and damage. Once a day, on a hit, skip the damage and the target forgets the last 5 minutes (WIS vs 13 resists)."},{"n":"Peeking Bow","s":"Weapon","b":"Silver","src":2,"p":3,"fx":"Longbow, +1 to hit and damage. Once a day, close your eyes and see through the arrow's tip as it flies."},{"n":"Hole Puncher","s":"Weapon","b":"Silver","src":2,"p":3,"fx":"War pick, +1 to hit and damage. Once a day, punch a 1 inch, 1 ft deep hole in any surface."},{"n":"The Punctuator","s":"Weapon","b":"Silver","src":2,"p":3,"fx":"Rapier, +1 to hit and damage. Once a day, on a hit, the target can't speak for a round (CON vs 13 resists). Shuts up casters."},{"n":"The Lumberer","s":"Weapon","b":"Silver","src":2,"p":3,"fx":"Greataxe, +1 to hit and damage. Once a day, fell a tree in one swing."},{"n":"The Yielder","s":"Weapon","b":"Silver","src":2,"p":3,"fx":"Sickle, +1 to hit and damage. Once a day, harvest every crop, fruit or larder within 60 ft in one sweep."},{"n":"The Machete","s":"Weapon","b":"Silver","src":2,"p":3,"fx":"Scimitar, +1 to hit and damage. Once a day, clear all undergrowth, bushes and fences within 60 ft."},{"n":"Basic Leather","s":"Chest","b":"Silver","src":2,"p":4,"fx":"Armor, +1 DR. Once a day, when you take Acid damage, halve Acid damage until the end of your next turn."},{"n":"Grounded Chain Mail","s":"Chest","b":"Silver","src":2,"p":4,"fx":"Armor, +1 DR. Once a day, when you take Lightning damage, halve Lightning damage until the end of your next turn."},{"n":"Muffling Scale Mail","s":"Chest","b":"Silver","src":2,"p":4,"fx":"Armor, +1 DR. Once a day, when you take Thunder damage, halve Thunder damage until the end of your next turn."},{"n":"Reflecting Plate","s":"Chest","b":"Silver","src":2,"p":4,"fx":"Armor, +1 DR. Once a day, when you take Radiant damage, halve Radiant damage until the end of your next turn."},{"n":"Scorched Leather","s":"Chest","b":"Silver","src":2,"p":4,"fx":"Armor, +1 DR. Once a day, when you take Fire damage, halve Fire damage until the end of your next turn."},{"n":"Shield of Tall Tales","s":"Shield","b":"Silver","src":2,"p":4,"fx":"Each morning tell the shield how you beat a monster type (CHA vs 11 if true, 16 if a lie). If it believes you: +2 DR and Advantage on DEX defenses against that monster type until tomorrow."},{"n":"Stable Half Plate","s":"Chest","b":"Silver","src":2,"p":5,"fx":"Armor, +1 DR. Once a day, when you take Force damage, halve Force damage until the end of your next turn."},{"n":"Still Living Hide","s":"Chest","b":"Silver","src":2,"p":5,"fx":"Armor, +1 DR. Once a day, when you take Necrotic damage, halve Necrotic damage until the end of your next turn."},{"n":"Sweltering Scale","s":"Chest","b":"Silver","src":2,"p":5,"fx":"Armor, +1 DR. Once a day, when you take Cold damage, halve Cold damage until the end of your next turn."},{"n":"Bag of Colding","s":"Container","b":"Silver","src":2,"p":5,"fx":"Pocket-space bag (500 lb) that keeps everything just below freezing. Never put it inside another pocket-space item."},{"n":"Feather Cloak","s":"Accessory","b":"Silver","src":2,"p":5,"fx":"Once a day, pull up the hood and become a hawk for 5 minutes (keep your mind; no casting)."},{"n":"Fork of Alu Kanit","s":"Tool","b":"Silver","src":2,"p":6,"fx":"Once a day, eat any loose object up to your level in pounds. Next morning, CON vs 13 or it's gone forever; pass and it reappears."},{"n":"Lion Pelt","s":"Accessory","b":"Silver","src":2,"p":6,"fx":"+1 to all defense rolls. Advantage to command or intimidate animals."},{"n":"Quill of the Grammaticus","s":"Tool","b":"Silver","src":2,"p":6,"fx":"Once a day, change one letter in a spell's name as you cast it; the GM decides what the new spell does."},{"n":"The Talking Skull","s":"Misc","b":"Silver","src":2,"p":6,"fx":"Once a day, wake the skull for 10 minutes. It answers questions and gives one omen about the near future. Roll its mood: 1 wrathful, 2 sullen, 3 suspicious, 4 chatty, 5 pleasing, 6 overjoyed."},{"n":"Umbrella Magica","s":"Weapon","b":"Silver","src":2,"p":6,"fx":"+1 to spell attacks while held. Once a day, open it as a reaction to float down safely from any fall."},{"n":"Armor of Renewal","s":"Chest","b":"Silver","src":3,"p":10,"fx":"Armor. 8 charges (1d8 back daily). When you take damage, spend charges to heal one ally you can see per charge for 1d4+F. Spend the last charge: roll d20, on a 1 something wild happens (GM's choice). Better boxes: 1d8 (Gold), 1d12 (Platinum), 1d20 (Legendary)."},{"n":"Armor of the Golden Squirrel","s":"Chest","b":"Silver","src":3,"p":11,"fx":"Light armor. Climb at full speed, Advantage on Acrobatics, and you glide when you fall: land up to double the fall distance away, no damage."},{"n":"Staff of Command","s":"Weapon","b":"Silver","src":3,"p":13,"fx":"Staff, +1 to spell attacks and spell DCs. Summoners control one extra summon. (+2 Gold, +3 Platinum.)"},{"n":"Staff of Convergence","s":"Weapon","b":"Silver","src":3,"p":14,"fx":"Staff, +1 to spell attacks and spell DCs. Nudge any wild-magic roll up or down by 1; summons get temporary HB slots when you trigger it."},{"n":"Staff of Mental Focus","s":"Weapon","b":"Silver","src":3,"p":14,"fx":"Staff, +1 to spell attacks and spell DCs. Once a day, with no summons out, regain mana equal to your Skill rank in Summoning."},{"n":"Blade Bracers of Presence","s":"Arms","b":"Silver","src":3,"p":17,"fx":"Blade bracers, +1 to hit and damage. Use STR or DEX instead of CHA for all CHA checks. Intimidation by cutlery."},{"n":"Elemental Affinity Mace","s":"Weapon","b":"Silver","src":3,"p":17,"fx":"Touch its head to an element (fire, ice, stone, water) and the mace turns into it, switching its damage type to match. +1 to hit and damage in a Gold box."},{"n":"Biographer's Journal","s":"Misc","b":"Silver","src":3,"p":21,"fx":"Writes down everything you do, say and think. Advantage on any check to remember something from your crawl."},{"n":"Figurine of Travel","s":"Misc","b":"Silver","src":3,"p":21,"fx":"Once a day, summon 6 riding horses (1 HB slot each) until you rest. Gold-box version: 6 griffons."},{"n":"Gem of Summoning","s":"Consumable","b":"Silver","src":3,"p":22,"fx":"Break it: a big monster (Mob of Floor+3 level) appears and obeys your mental orders for 1 minute, then the gem is gone."},{"n":"Primordial Bark","s":"Misc","b":"Silver","src":3,"p":24,"fx":"Carve an animal into it for an hour (DEX vs 15): it becomes a real beast ally (Mob of your level) until sunset. Bark regrows in 1d4 days."},{"n":"Socks of Vibration","s":"Feet","b":"Silver","src":3,"p":25,"fx":"Extremely grippy socks. Feel movement through the floor: you sense anything touching the ground within 10 ft, even unseen."},{"n":"Saddle of Flames Emblem","s":"Accessory","b":"Silver","src":3,"p":25,"fx":"Stamp it on a saddle: your mount leaves a burning trail for a round. Crossing it deals 1d6+F Fire. Legendary version: lasts an hour, 6d8+F."},{"n":"Armor of Exsanguination","s":"Chest","b":"Gold","src":3,"p":11,"fx":"Heavy armor. When you drop to 0, everything living within 10 ft rolls CON vs 15 or takes 3d6+F Piercing as bite wounds open. Every 10 damage drained = 1 successful Dying roll; 3 successes and you stand back up with up to 30 HB."},{"n":"Chain Bulwark Shield","s":"Shield","b":"Gold","src":3,"p":12,"fx":"+1 DR. 4 charges (1d4 back daily): spend one per target to chain it within 10 ft (STR vs 15 or Restrained; 2 charges on one target = Disadvantage to escape)."},{"n":"Ring of Time Jump","s":"Accessory","b":"Gold","src":3,"p":12,"fx":"Once a day, take a second turn right after your first. Next round you're Paralyzed while time catches up."},{"n":"Ring of Trade","s":"Accessory","b":"Gold","src":3,"p":13,"fx":"Once a day, a minute's ritual summons a random merchant (and their shop) for an hour. Try to rob or cheat them and you're the one who gets hurt."},{"n":"Staff of Outfitting","s":"Weapon","b":"Gold","src":3,"p":15,"fx":"4 charges (1d4 back daily): kit out a summon with gear. Each charge picks one: +1 Skill rank, reroll on Advantage, -1 damage taken, reads 5 languages, 20 ft light, or two weapon proficiencies."},{"n":"Forearm Blade of Demonic Influence","s":"Arms","b":"Gold","src":3,"p":18,"fx":"+1 to a stat of your choice, +1 to hit and damage. CURSED: after a week you're faster and nastier; after a month a second demonic blade grows from your other arm; after a year horns and hooves. Can't take it off. Disadvantage with any other weapon."},{"n":"Life-Blood Scythe","s":"Weapon","b":"Gold","src":3,"p":19,"fx":"Gains a blood charge per kill. 5 charges: +Skill rank extra damage per hit. 10 charges: a grove of blood-red trees bursts up here. You can teleport between your groves a few times a day."},{"n":"Phantom Bola","s":"Weapon","b":"Gold","src":3,"p":19,"fx":"Bola, +2 to hit. On a crit, two more ghost bolas fly at the two nearest enemies within 60 ft (escape: STR vs 15)."},{"n":"Weapons of Retaliation","s":"Weapon","b":"Gold","src":3,"p":21,"fx":"A matched pair of one-handed weapons, +1 to hit and damage. They return to you each morning. Attacks of opportunity hit with both."},{"n":"Map of History","s":"Misc","b":"Gold","src":3,"p":22,"fx":"Shows every known place in the world (or on this floor), but not what's land, water, up or down. Platinum version: write a year on it to see what was known then."},{"n":"Bardiche of Brutality","s":"Weapon","b":"Platinum","src":3,"p":16,"fx":"+3 to hit and damage. When it kills, teleport up to 30 ft and keep swinging the leftover damage into a new target. Repeat until damage or targets run out."},{"n":"Shuriken of Revelation","s":"Weapon","b":"Platinum","src":3,"p":20,"fx":"+3 to hit and damage, returns to your hand. Anything it hurts rolls CHA vs 17 or blurts a secret it thinks you want to know."},{"n":"Tome of Legends","s":"Misc","b":"Platinum","src":3,"p":25,"fx":"Say a subject aloud and it opens to every legend about it, true or not (WIS vs 17 to judge which). Advantage to recall anything you've read in it."},{"n":"Ancestral Nunchucks","s":"Weapon","b":"Legendary","src":3,"p":16,"fx":"+3 to hit. Hits (and your unarmed strikes) add your Skill rank in damage. On a hit, attack the same target again. When you spend a power, roll d20: 10+ refunds 1 point."},{"n":"Orb of Soul Capture","s":"Neck","b":"Legendary","src":3,"p":23,"fx":"When a Boss dies near you, you absorb its soul and gain a permanent trait from its type: Beast = Advantage on Perception, Undead = drop to 1 instead of 0 (CON check), Fiend = 120 ft teleport, Dragon = once a day turn a failed defense into a success, and so on. Each type only once."},{"n":"Quill of Life Binding","s":"Tool","b":"Legendary","src":3,"p":24,"fx":"Any contract signed with it binds both sides. Break any term and your max HB drops by 1 slot a day until you comply. It can't be healed."},{"n":"Lance of Perforation","s":"Weapon","b":"Silver","src":4,"p":15,"fx":"Lance. A few times a day (= your Skill rank), declare the hit ignores the target's armor and natural DR."},{"n":"Sharptooth Jaw","s":"Face","b":"Silver","src":4,"p":29,"fx":"Metal teeth that fit over yours. You can bite as an unarmed strike for 1d6+F Piercing; if you already bite, add a damage die."},{"n":"Potion of Breath Transmutation","s":"Consumable","b":"Silver","src":4,"p":31,"fx":"Change your breath attack's damage type (Fire, Cold, Lightning, Acid or Poison) for the next 3 uses."},{"n":"Potion of Blinding Breath","s":"Consumable","b":"Silver","src":4,"p":31,"fx":"Your next breath attack also Blinds anyone who fails CON (save at the end of each turn)."},{"n":"Potion of Turning Breath","s":"Consumable","b":"Silver","src":4,"p":31,"fx":"Your next breath attack also sends undead fleeing from you for a minute (WIS resists)."},{"n":"Dragonslayer's Shield","s":"Shield","b":"Gold","src":4,"p":18,"fx":"Dragon-skull shield, 7 charges. Shatter Scales (2): a target within 30 ft rolls CON vs 14 or loses 2 DR. Suppress (3): shield-bash; target can't use its breath or venom for a minute (CON vs 14 each try). Create Vulnerability (2, reaction when missed): attacker loses its resistances until its next turn."},{"n":"Dragonclaw Gauntlets","s":"Hands","b":"Gold","src":4,"p":18,"fx":"Unarmed strikes are magic, 1d8+F Slashing, +2 to hit and damage. A few times a day, a strike can also force the target to drop what it's holding (STR resists)."},{"n":"Dragon Eye Goggles","s":"Face","b":"Gold","src":4,"p":19,"fx":"Darkvision 60 ft (or +60 ft). Advantage to spot coins. Immune to dazzle and glare effects."},{"n":"Sheet of Appearance","s":"Misc","b":"Gold","src":4,"p":26,"fx":"Near-invisible silk. Drape it over something: invisibility and illusions end and shapechangers revert. WIS vs 15 or they still believe they're hidden."},{"n":"Talons of Laceration","s":"Hands","b":"Gold","src":4,"p":29,"fx":"Claw attacks crit on 19-20, and crits roll damage dice three times."},{"n":"Potion of Fairy's Breath","s":"Consumable","b":"Gold","src":4,"p":31,"fx":"Your next breath attack hits the ethereal: strips invisibility and blur effects, dispels illusions, reverts shapechangers."},{"n":"Potion of Stunning Breath","s":"Consumable","b":"Gold","src":4,"p":31,"fx":"Anyone who fails your next breath attack's defense rolls CON or is Stunned until the end of their next turn."},{"n":"Potion of Dispelling Breath","s":"Consumable","b":"Gold","src":4,"p":31,"fx":"Your next breath attack also strips active buffs from everything it damages."},{"n":"Gem of Preservation","s":"Chest","b":"Gold","src":4,"p":32,"fx":"Grafted into your skin. Crits on you become normal hits. Once a day, drop to 1 instead of 0 and can't go lower until your next turn ends. Take your max HB in that window and the gem shatters... and so do you."},{"n":"Armor of Draconic Wildshape","s":"Chest","b":"Platinum","src":4,"p":14,"fx":"Hide armor, +2 DR. Speak Draconic. Halve one element (by the dragon it came from). Shapeshifters can turn into dragons and keep the armor's bonus in any form."},{"n":"Bow of Dragon Capture","s":"Weapon","b":"Platinum","src":4,"p":15,"fx":"Longbow, +2, needs STR 17 and uses STR. Every hit on a dragon drains 1 STR; a crit adds a damage die and drains 2 more."},{"n":"Dragonclaw Ring","s":"Accessory","b":"Platinum","src":4,"p":16,"fx":"Once a day, turn into a young dragon (red if you're a jerk, gold if you're not)."},{"n":"Staff of Dragon Might","s":"Weapon","b":"Platinum","src":4,"p":17,"fx":"10 charges (1d6+4 back daily). Dragonbreath (3): 30 ft cone, 8d6+F Fire, DEX halves. Dragonskin (2): +4 DR to an unarmored ally for 8 hrs. Draconic Might (5): ally gets +2 STR hits, Advantage on STR/CON/CHA, and bonus HB for 10 minutes."},{"n":"Cloak of the Silver Dragon","s":"Accessory","b":"Platinum","src":4,"p":25,"fx":"A few times a day (= Skill rank), fly 60 ft as a bonus action. End your turn in the air and you fall."},{"n":"Potion of Negative Energy Breath","s":"Consumable","b":"Platinum","src":4,"p":31,"fx":"Your next breath attack adds 5d12+F Necrotic to anyone who fails. The dead rise as hostile zombies next turn."},{"n":"Ring of Dragon Domination","s":"Accessory","b":"Legendary","src":4,"p":16,"fx":"Dragons can't willingly harm you. Advantage to persuade or scare dragons. Once a week, a dragon within 1,000 ft must follow one suggestion for a week. Hurt a dragon while wearing it and it goes dead for a month."},{"n":"Indestructible Dragon-Armor","s":"Chest","b":"Legendary","src":4,"p":30,"fx":"Armor sized for a dragon, +5 DR, with Talons and a Sharptooth Jaw built in. Can't be grappled easily or shapeshifted. Once a day, immune to all damage for a minute. (Wonderful Boss gear.)"},{"n":"Ring of Ascendancy","s":"Accessory","b":"Legendary","src":4,"p":28,"fx":"ARTIFACT. On a dragon: every breath and spell does max damage at double range. On anyone else: instant disintegration attempt, then CON vs 19 every hour or it drains you dry."},{"n":"Boots of Teleportation","s":"Feet","b":"Gold","src":5,"p":1,"fx":"Once a day, a command word teleports the BOOTS up to 60 ft away. You stay where you are. Barefoot."},{"n":"Horn of Invisibility","s":"Tool","b":"Gold","src":5,"p":1,"fx":"Once a day, become invisible for as long as you keep blowing the horn, which can be heard 500 ft away."},{"n":"Brassiere of Eternal Flame","s":"Chest","b":"Gold","src":5,"p":1,"fx":"Racy underwear that is permanently on fire and can't be put out. Gives light. Gives looks."},{"n":"Hat of Disguise Self","s":"Head","b":"Gold","src":5,"p":1,"fx":"Once a day the hat disguises you. The hat chooses when, and as what."},{"n":"Ring of Beast Turning","s":"Accessory","b":"Gold","src":5,"p":1,"fx":"Once a day, a command word turns one beast... slowly rotating it on the spot until it faces the other way."},{"n":"Scroll of Mass Confusion","s":"Misc","b":"Gold","src":5,"p":1,"fx":"Looks terrifyingly powerful. Deciphering it needs an INT check against 50. Good luck."},{"n":"Wand of Magic Detection","s":"Tool","b":"Gold","src":5,"p":1,"fx":"Its gem glows orange when a magic item is within 50 ft. It always counts itself."},{"n":"Crown of Domination","s":"Head","b":"Legendary","src":5,"p":1,"fx":"4 charges (1d4 back daily). Spend one to give a telepathic one-line order within 100 ft. One strong target (Boss, or a crawler level 5+) resists with CHA vs 16 or obeys up to 24 hrs; any number of weak Mobs obey for a year, no roll. CURSED: every order you give, roll CHA vs 15 (+1 per failure) or the crown twists it for its maker; at 20 it only comes off when you die."},{"n":"Sho /* ===================== LOOT: ITEM LIBRARY (5E items converted to DCC, paraphrased) ===================== */
const BOXES=["Bronze","Silver","Gold","Platinum","Legendary"];
const BOX_W=n=>n<=3?[60,30,9,1,0]:n<=6?[35,40,20,4,1]:n<=9?[20,35,30,12,3]:n<=12?[10,25,35,22,8]:[5,15,35,30,15];
function wpick(w){const t=w.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<w.length;i++){if((r-=w[i])<0)return i}return w.length-1}
const SLOTS=[...new Set(ITEMS.items.map(i=>i.s))].sort();
function lootState(){return S.loot||(S.loot={box:"floor",slot:"any",src:"any",q:"",fbox:"any",fslot:"any",fsrc:"any",lim:48,res:[],target:"floor"})}
function itemPool(box,slot,src,q){q=(q||"").toLowerCase();return ITEMS.items.filter(it=>(box==="any"||it.b===box)&&(slot==="any"||it.s===slot)&&(src==="any"||it.src===+src)&&(!q||(it.n+" "+it.fx+" "+it.s).toLowerCase().includes(q)))}
function rollItems(f,k){const L=lootState(),out=[],used=new Set(L.res.map(x=>x.n));
  for(let i=0;i<k;i++){let bi=L.box==="floor"?wpick(BOX_W(+f.number||1)):L.box==="any"?-1:BOXES.indexOf(L.box);let pool=[];
    const tryBox=b=>itemPool(b,L.slot,L.src).filter(x=>!used.has(x.n));
    if(bi<0)pool=tryBox("any");else{const order=[bi];for(let d=1;d<5;d++){order.push(bi-d,bi+d)}for(const j of order){if(j<0||j>4)continue;pool=tryBox(BOXES[j]);if(pool.length)break}}
    if(!pool.length)break;const it=R(pool);used.add(it.n);out.push(it)}
  return out}
function itemLine(it){return `${it.n} [${it.b} box, ${it.s}]: ${it.fx} (${typeof it.src==="number"?ITEMS.src[it.src]:it.src}${it.p?" p."+it.p:""})`}
function itemCard(it,i,from){return `<div class="card itm box-${it.b.toLowerCase()}" style="padding:12px;display:grid;gap:6px;align-content:start">
  <div class="row" style="justify-content:space-between;align-items:baseline;flex-wrap:nowrap"><h3 style="font-size:15px">${esc(it.n)}</h3><span class="pill bx">${esc(it.b)}</span></div>
  <div class="mono dim" style="font-size:12px">Gear Slot: ${esc(it.s)}</div>
  <p style="margin:0;font-size:14px;line-height:1.45">${esc(it.fx)}</p>
  <div class="row" style="justify-content:space-between;align-items:center"><span class="dim" style="font-size:11px">${esc(ITEMS.src[it.src])}${it.p?", p."+it.p:""}</span>
  <span class="row" style="gap:6px">${from==="roll"?`<button class="btn sm ghost" data-act="lootReroll" data-i="${i}" title="Reroll this one">↻</button>`:""}<button class="btn sm gold" data-act="lootAdd" data-n="${esc(it.n)}" data-from="${from}" data-i="${i}">+ Add</button></span></div></div>`}
function lootTargets(f){return `<option value="floor">Floor loot list only</option>${f.neighborhoods.map(n=>`<option value="nb:${n.id}">Neighborhood: ${esc(n.name)}</option>`).join("")}${f.quests.map(q=>`<option value="q:${q.id}">Quest: ${esc(q.name)}</option>`).join("")}`}
function selOpts(vals,cur,anyLbl){return `<option value="any"${cur==="any"?" selected":""}>${anyLbl}</option>`+vals.map(([v,l])=>`<option value="${esc(v)}"${String(cur)===String(v)?" selected":""}>${esc(l)}</option>`).join("")}
function browseList(){const L=lootState(),all=itemPool(L.fbox,L.fslot,L.fsrc,L.q),show=all.slice(0,L.lim);
  return `<div class="dim" style="font-size:12px;margin-bottom:8px">${all.length} item${all.length===1?"":"s"}${all.length>show.length?`, showing ${show.length}`:""}</div>
  <div class="grid g3">${show.map(it=>itemCard(it,ITEMS.items.indexOf(it),"lib")).join("")||`<div class="muted">Nothing matches. Loosen a filter.</div>`}</div>
  ${all.length>show.length?`<div style="margin-top:10px"><button class="btn sm" data-act="lootMore">Show more</button></div>`:""}`}
function vLoot(f){const L=lootState(),w=BOX_W(+f.number||1);
  const boxOpts=`<option value="floor"${L.box==="floor"?" selected":""}>Suggested for Floor ${esc(f.number)}</option>`+selOpts(BOXES.map(b=>[b,b+" box"]),L.box,"Any box").replace(/^<option value="any"[^>]*>[^<]*<\/option>/,m=>m);
  const srcV=ITEMS.src.map((s,i)=>[i,s]),slotV=SLOTS.map(s=>[s,s]);
  const rows=(f.loot||[]).map((l,i)=>`<tr${l.given?' class="done"':""}><td><input type="checkbox" data-p="loot.${i}.given" ${l.given?"checked":""} aria-label="Handed out"></td>
    <td><div class="row" style="gap:10px;align-items:flex-start;flex-wrap:nowrap">${l.img?`<button class="imgthumb sm" data-act="imgView" data-imgt="floor" data-img="loot.${i}.img" aria-label="View ${esc(l.n)} full size"><img src="${esc(l.img)}" alt=""></button>`:""}<div style="flex:1;min-width:0"><b>${esc(l.n)}</b><div class="dim" style="font-size:12px">${esc(l.fx)}</div><div class="dim mono" style="font-size:11px">Gear Slot: ${esc(l.s)} · ${esc(l.src)}${l.p?" p."+esc(l.p):""}</div>
      <div class="row" style="gap:6px;margin-top:4px"><label class="linkish" style="cursor:pointer;font-size:12px">${l.img?"Change art":"＋ Add art"}<input type="file" accept="image/*" data-img="loot.${i}.img" data-imgt="floor" data-imgk="item" hidden></label>${l.img?`<button class="linkish" style="font-size:12px" data-act="imgClear" data-img="loot.${i}.img" data-imgt="floor">Remove</button>`:""}</div></div></div></td>
    <td><span class="pill bx box-${String(l.b).toLowerCase()}">${esc(l.b)}</span></td>
    <td><input type="text" data-p="loot.${i}.where" value="${esc(l.where||"")}" placeholder="Where / who drops it"></td>
    <td><button class="x" data-act="del" data-p="loot" data-i="${i}" aria-label="Remove">✕</button></td></tr>`).join("");
  return `<section class="panel"><header><h2>Roll loot</h2><span class="dim" style="font-size:12px">Floor ${esc(f.number)} odds: ${BOXES.map((b,i)=>w[i]?`${b} ${w[i]}%`:"").filter(Boolean).join(" · ")}</span></header>
   <div class="row">
    <label class="f"><span>Box</span><select id="lootBox">${boxOpts}</select></label>
    <label class="f"><span>Gear slot</span><select id="lootSlot">${selOpts(slotV,L.slot,"Any slot")}</select></label>
    <label class="f"><span>Book</span><select id="lootSrc">${selOpts(srcV,L.src,"All books")}</select></label>
    <label class="f"><span>Send to</span><select id="lootTarget">${lootTargets(f).replace(`value="${L.target}"`,`value="${L.target}" selected`)}</select></label>
   </div>
   <div class="row" style="margin-top:10px"><button class="btn gold" data-act="lootRoll" data-k="1">Roll 1 item</button><button class="btn" data-act="lootRoll" data-k="3">Roll 3</button><button class="btn" data-act="lootRoll" data-k="6">Roll a hoard (6)</button>${L.res.length?`<button class="btn ghost" data-act="lootAddAll">+ Add all ${L.res.length}</button><button class="btn ghost" data-act="lootClear">Clear</button>`:""}</div>
   ${L.res.length?`<div class="grid g3" style="margin-top:12px">${L.res.map((it,i)=>itemCard(it,i,"roll")).join("")}</div>`:`<p class="tip" style="margin-top:10px">"Suggested" rolls a box tier by floor depth, then an item from that tier. Box odds are a starting point. Adjust to your table.</p>`}
  </section>
  <section class="panel"><header><h2>Floor ${esc(f.number)} loot list</h2><span class="dim">${(f.loot||[]).filter(l=>l.given).length}/${(f.loot||[]).length} handed out</span></header>
   ${rows?`<div class="tbl"><table class="t"><thead><tr><th>Got</th><th>Item</th><th>Box</th><th>Where</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="muted">Nothing yet. Roll or browse, then press <b>+ Add</b>.</div>`}
  </section>
  <section class="panel"><header><h2>Item library</h2><span class="dim">${ITEMS.items.length} items from ${ITEMS.src.length} sources (incl. the 5e SRD), converted to DCC</span></header>
   <div class="row" style="margin-bottom:12px">
    <label class="f" style="flex:1;min-width:180px"><span>Search</span><input type="search" id="lootQ" value="${esc(L.q)}" placeholder="fire, teleport, hat..."></label>
    <label class="f"><span>Box</span><select id="lootFBox">${selOpts(BOXES.map(b=>[b,b]),L.fbox,"Any box")}</select></label>
    <label class="f"><span>Gear slot</span><select id="lootFSlot">${selOpts(slotV,L.fslot,"Any slot")}</select></label>
    <label class="f"><span>Book</span><select id="lootFSrc">${selOpts(srcV,L.fsrc,"All books")}</select></label>
   </div>
   <div id="lootList">${browseList()}</div>
  </section>`}
function lootAdd(f,it){const L=lootState(),t=L.target||"floor";let where="";
  if(t.startsWith("nb:")){const n=f.neighborhoods.find(x=>x.id===t.slice(3));if(n){where=n.name;const ix=n.items.findIndex(x=>!String(x).trim());ix>=0?n.items[ix]=itemLine(it):n.items.push(itemLine(it))}}
  if(t.startsWith("q:")){const q=f.quests.find(x=>x.id===t.slice(2));if(q){where=q.name;const ix=q.items.findIndex(x=>!String(x).trim());ix>=0?q.items[ix]=itemLine(it):q.items.push(itemLine(it))}}
  (f.loot=f.loot||[]).push({id:uid(),n:it.n,b:it.b,s:it.s,fx:it.fx,src:ITEMS.src[it.src],p:it.p,where,given:false});return where}
