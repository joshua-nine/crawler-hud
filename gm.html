 fight like one creature.", "attacks": [["Battle-axe (Hogug)", "STR", 8, "Slashing", "5ft", 0, 0, ""], ["Greataxe (Dura)", "STR", 12, "Slashing", "5ft", 0, 0, ""], ["Leadership", "CHA", 4, "—", "30ft", 0, 1, "Allies add +1d4 for a minute."]], "traits": [["Two Bodies", "Run as two Bosses sharing the Boss's HB slots split in half."], ["Tag Team", "Advantage on attacks against a crawler next to the other twin."], ["Contract", "Under contract they won't budge. Outbid the contract before the fight."]], "clues": ["Hogug is gentler; Dura loves the slaughter. Drive a wedge.", "Kill one and the other fights alone and enraged.", "Get them under YOUR contract."], "source": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains), p.21 (5e, converted)", "book": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains)"}, {"name": "Alwin Yelven", "origin": "Frozen Druid", "page": 22, "role": "caster", "size": 4, "type": "Humanoid (blue-skinned wood elf)", "tier": "Borough", "move": "20+S", "drAdj": 1, "concept": "A coastal druid who froze his whole fishing town to 'restore the balance'. He watches from an ice tower with a frost imp whispering in his ear.", "attacks": [["Ice Knife", "WIS", 6, "Cold + Piercing", "60ft", 0, 0, ""], ["Ice Storm", "WIS", 8, "Cold + Bludgeoning", "Burst 20ft at 300ft", 1, 1, "Area becomes icy (Stiff Legs)."], ["Sleet Storm", "WIS", 4, "Cold", "Burst 40ft", 1, 1, "Spellcasters lose concentration; crawlers Staggered."]], "traits": [["Ice Skin", "+2 DR (in the DR above)."], ["Siege Monster", "Double damage to objects and buildings."], ["Frost Zombies", "Frozen villagers patrol for him."]], "clues": ["An ice devil is really pulling his strings. Banish the imp.", "His druid circle still wants him back. Mercy ends this.", "Fire melts his tower stairs."], "source": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains), p.22 (5e, converted)", "book": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains)"}, {"name": "Goshixa", "origin": "Lizardfolk Life-force Mage", "page": 23, "role": "caster", "size": 4, "type": "Humanoid (lizardfolk)", "tier": "Borough", "move": "20+S", "drAdj": 1, "concept": "A blue-scaled lizardfolk sorcerer who rips the life out of victims for fuel. Halfling casters are his favorite snack.", "attacks": [["Lifeforce Drain", "CHA", 8, "Necrotic", "60ft", 0, 1, "He refills HB equal to the damage."], ["Fireball", "CHA", 6, "Fire", "Burst 20ft at 150ft", 1, 0, ""], ["Hold Monster", "CHA", 4, "Psychic", "90ft", 0, 1, "Paralyzed (repeat the check each turn)."]], "traits": [["Heightened Spell", "A few times a day, one target rolls its check at Disadvantage."], ["Greater Invisibility", "Goes invisible and keeps casting."], ["Feeds on His Own", "Kills his own minions to refill HB."]], "clues": ["His tribe hates him. Start a revolt.", "Every snack kept in his basement is a witness and an ally.", "His claws are weak; casting is everything. Shut his mouth."], "source": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains), p.23 (5e, converted)", "book": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains)"}, {"name": "Jenika", "origin": "Myconid Death Cult", "page": 24, "role": "brute", "size": 5, "type": "Plant (myconid)", "tier": "Borough", "move": "20+S", "drAdj": 1, "concept": "A sickly-green walking mushroom that wants to be a god of decay. Its cult's faith feeds its power, and it quietly kills them too.", "attacks": [["Fist", "STR", 4, "Bludgeoning + Poison", "5ft", 0, 0, "Hits like a truck: roll double dice."], ["Hallucination Spores", "CON", 6, "Poison", "5ft", 0, 1, "Poisoned; incapacitated while it lasts."], ["Pacifying Spores", "CON", 4, "Poison", "5ft", 0, 1, "Stunned for a minute (repeat the check)."]], "traits": [["Animated Spores", "Turns corpses into spore servants in a day."], ["Sun Sickness", "Disadvantage on everything in sunlight; an hour of sun kills it."], ["Rapport Spores", "Its cult shares a telepathic link."]], "clues": ["Sunlight. Open the mine roof or bring a light source.", "Show the cult the bodies it hides.", "Burn the spore servants before they rise."], "source": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains), p.24 (5e, converted)", "book": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains)"}, {"name": "Dr Hoide Oke", "origin": "Flesh-merging Alchemist", "page": 25, "role": "caster", "size": 4, "type": "Humanoid (half-yeti)", "tier": "Borough", "move": "20+S", "drAdj": 0, "concept": "A cocky alchemist with a human face on a mangy yeti body. He fuses creatures together on his operating table to build the perfect servant.", "attacks": [["Claws", "STR", 6, "Slashing", "5ft", 0, 0, "Two a turn."], ["Transmuter's Bolt", "INT", 8, "Acid", "60ft", 0, 0, ""], ["Merge", "INT", 6, "Necrotic", "5ft", 0, 1, "A downed crawler gets fused with a beast (a permanent body change) unless rescued in a minute."]], "traits": [["Transmuter's Stone", "Swaps between darkvision, +10 move, or halving one element."], ["Abominations", "Merged creatures patrol his trapped halls."], ["Cult", "Worshippers guard the cellar door."]], "clues": ["He merged his own wife with his wolfhound. She hates him. Find her.", "His traps don't trigger for his abominations. Steal a lab coat... or a smell.", "Take the stone and he's just a sad man in a yeti suit."], "source": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains), p.25 (5e, converted)", "book": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains)"}, {"name": "Adbek, the Molder", "origin": "Duergar Forgemaster", "page": 26, "role": "brute", "size": 4, "type": "Humanoid (duergar)", "tier": "Borough", "move": "15+S", "drAdj": 2, "concept": "A soot-grey duergar smith who melts earth elementals down into walking armor. Only one suit works; the rest are half-finished.", "attacks": [["Fire Lance", "STR", 12, "Piercing + Fire", "10ft", 0, 0, "Enlarged: roll double dice."], ["Fire Spray", "STR", 6, "Fire", "Cone 15ft / Line 30ft", 1, 0, "Recharges on a 5–6. DEX halves."]], "traits": [["Enlarge", "Grows Large for a minute; Advantage on STR."], ["Invisibility", "Once a fight, vanishes until he attacks."], ["Sunlight Sensitivity", "Disadvantage on attacks in sunlight."], ["Elemental Armor", "Starts with bonus HB slots equal to the floor."]], "clues": ["Free a trapped elemental and it turns on him.", "His smiths are exhausted. Push his ego in public.", "Sonic damage cracks the armor."], "source": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains), p.26 (5e, converted)", "book": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains)"}, {"name": "Lord Ened Athatea", "origin": "Noble Merchant", "page": 27, "role": "face", "size": 4, "type": "Humanoid (blue dragonborn)", "tier": "Neighborhood", "move": "20+S", "drAdj": 1, "concept": "A polished, blue-scaled merchant lord whose ships sit idle because of a new rival. So he's framing them as gangsters and hiring crawlers to do the dirty work.", "attacks": [["Rapier", "DEX", 8, "Piercing", "5ft", 0, 0, "Three thrusts a turn."], ["Command Voice", "CHA", 4, "Psychic", "30ft", 0, 1, "Target does one thing he orders (CHA check resists)."]], "traits": [["Parry", "+2 DR against one melee hit a round."], ["Council Seat", "Can call the city guard (or the floor's NPC guards)."]], "clues": ["The rival isn't gangsters. Find proof and expose him.", "His arrogance makes enemies on the council.", "He doesn't fight his own battles. Corner him alone."], "source": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains), p.27 (5e, converted)", "book": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains)"}, {"name": "Jenzit, Lord of the Waste", "origin": "Slaver Warlord", "page": 28, "role": "skirm", "size": 3, "type": "Humanoid (gnome)", "tier": "Borough", "move": "15+S", "drAdj": 2, "concept": "A leather-wrapped gnome slaver with goggles and a mechanical arm with a pistol built in. He's ready to expand his market beyond the wastes.", "attacks": [["Scimitar", "DEX", 10, "Slashing", "5ft", 0, 0, ""], ["Arm Pistol", "DEX", 8, "Piercing", "60ft", 0, 0, "Quick draw: also as a bonus action."]], "traits": [["Hardened Leathers", "Halves physical damage."], ["Mercenary Army", "Raiders, scouts and guards of every kind."]], "clues": ["His family wants him dead. He killed his father and stole the savings.", "Free the slaves and his army runs out of pay.", "The pistol arm jams in sand."], "source": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains), p.28 (5e, converted)", "book": "The DM Lair Patreon, Feb 2021 (Tier 3 Villains)"}, {"name": "Mist Bone Captain", "origin": "Mist Bones", "page": 5, "role": "brute", "size": 4, "type": "Undead (mist bone)", "tier": "Borough", "move": "20+S, pass through walls", "drAdj": 2, "concept": "A heavily armored skeleton wreathed in blue mist that leads an ancient army. Its men can go ghostly for a moment when hit.", "attacks": [["Longsword", "STR", 8, "Slashing", "5ft", 0, 0, "Two swings a turn."], ["Retributive Strike", "STR", 8, "Slashing", "5ft", 0, 0, "Free swing at anyone who hurt it since its last turn."]], "traits": [["Mist Form", "When hit, halves physical damage until its next turn."], ["Summon Shadow (1/day)", "50% chance a shadow joins it for 10 minutes."], ["Misty Step", "Teleports 30 ft."], ["Parry", "+3 DR against one melee hit a round."], ["Unnatural Undeath", "Turn Undead does nothing."]], "clues": ["Mist form doesn't stop magic damage.", "Ending its turn inside a wall hurts it. Make it phase.", "Its army is old. Find the forgotten battlefield it came from."], "source": "The DM Lair Patreon, Mar 2021 (Chaos & Control), p.5 (5e, converted)", "book": "The DM Lair Patreon, Mar 2021 (Chaos & Control)"}, {"name": "Velocerabbit", "origin": "Killer Rabbit", "page": 7, "role": "skirm", "size": 4, "type": "Beast (giant rabbit)", "tier": "City", "move": "40+S, bonus dash", "drAdj": 2, "concept": "A man-sized fluffy white bunny. Then the mane flares, it rises on its hind legs and the screaming starts.", "attacks": [["Claw", "STR", 8, "Slashing", "5ft", 0, 1, "Two a turn. Beat Evade by 5+: Blood Trail."], ["Bite", "STR", 8, "Slashing", "5ft", 0, 0, ""], ["Pounce", "STR", 8, "Slashing", "20ft leap", 0, 1, "Take Down; free bite on a prone target."]], "traits": [["Punt (reaction)", "When hit, kicks the attacker 15 ft (STR check) and the hit misses."], ["Lair of Bones", "Its cave is ringed with everyone else who underestimated it."]], "clues": ["It's still a rabbit. Food, a burrow, or a big bird scare it.", "Bleeding stops with any magic healing.", "Never stand in front of it after you hit it."], "source": "The DM Lair Patreon, Mar 2021 (Chaos & Control), p.7 (5e, converted)", "book": "The DM Lair Patreon, Mar 2021 (Chaos & Control)"}, {"name": "Rubble Raiser", "origin": "Living Ruin", "page": 9, "role": "caster", "size": 4, "type": "Construct (rubble)", "tier": "Borough", "move": "20+S", "drAdj": 2, "concept": "A humanoid of broken masonry with a face shaped from soft stone, born from a ruined tower's leftover magic. It builds an army out of the building it came from.", "attacks": [["Staff", "STR", 8, "Bludgeoning", "5ft", 0, 0, "Two swings a turn."], ["Shatter", "INT", 8, "Thunder", "Burst 10ft at 60ft", 1, 0, "Twice a day."], ["Raise Rubble", "INT", 4, "—", "30ft", 0, 1, "Recharge 6: a pile of rubble becomes a Rubble Guardian or Rubble Roller."]], "traits": [["Stone Body", "Immune to ordinary weapons (magic or adamantine only)."], ["Rubble Repair (3/day)", "When one of its rubble dies, rebuild it."]], "clues": ["Its nature matches the ruin: a church raiser may be a protector.", "Clear the rubble piles and it has nothing to raise.", "Adamantine weapons shatter its kind."], "source": "The DM Lair Patreon, Mar 2021 (Chaos & Control), p.9 (5e, converted)", "book": "The DM Lair Patreon, Mar 2021 (Chaos & Control)"}, {"name": "Frosty the Snowman", "origin": "Animated Snowman", "page": 3, "role": "brute", "size": 5, "type": "Construct (snowman)", "tier": "Borough", "move": "30+S", "drAdj": 0, "concept": "A jolly giant snowman with coal eyes and three blue gems. He'd really rather you left before Wintermas morning.", "attacks": [["Double Swipe", "STR", 10, "Bludgeoning + Cold", "5ft", 0, 0, "Two swipes a turn."], ["Chilling Ray (3 charges)", "CON", 6, "Cold", "30ft", 0, 1, "Paralyzed for a minute; any Fire damage ends it."]], "traits": [["Berserk", "If a snowman buddy dies, he adds a headbutt every turn."], ["Weak to Fire", "Fire damage gives him Disadvantage until his next turn."], ["Snow Meld", "Bonus action: sink into snow, pop up 40 ft away."]], "clues": ["His two sidekicks hide among decoy snowmen.", "Fire is everything.", "He's friendly at first. Leaving is an option."], "source": "The Night Before Wintermas, p.3 (5e, converted)", "book": "The Night Before Wintermas"}, {"name": "Santa (Possessed)", "origin": "Dominated Gift-giver", "page": 11, "role": "brute", "size": 5, "type": "Humanoid (possessed)", "tier": "City", "move": "30+S", "drAdj": 1, "concept": "The jolly old elf, eyes glazed, a spiked black crown on his head. An Old One is driving.", "attacks": [["Belly Blow", "STR", 10, "Bludgeoning", "5ft", 0, 0, "Like a bowl full of jelly, then not."], ["Gnome Missile", "STR", 6, "Bludgeoning", "30ft", 0, 0, "Throws a gnome."], ["Naughty or Nice", "CHA", 10, "Psychic", "Burst 10ft", 1, 0, "Hurts anyone who damaged him last turn; heals the rest."], ["Crown of Domination", "CHA", 4, "Psychic", "Sight", 0, 1, "CHA check or the target attacks/moves for him."]], "traits": [["Winter's Aura", "Starting a turn within 5 ft: Cold damage."], ["Almost Immortal", "At 0 he drops and the Crown falls off. Destroy the crown (DR low, about 40 damage) to banish the Old One."], ["Shrug It Off (2/day)", "Turn a failed check into a success."]], "clues": ["The crown is the real Boss.", "Knock him out, don't kill him: he can save Wintermas.", "He gets two actions and an extra one after a crawler's turn."], "source": "The Night Before Wintermas, p.11 (5e, converted)", "book": "The Night Before Wintermas"}, {"name": "The Old One's Avatar", "origin": "Elder Thing", "page": 11, "role": "caster", "size": 6, "type": "Aberration", "tier": "City", "move": "30+S teleport", "drAdj": 1, "concept": "A fragment of an Old One poured into the world through a cursed crown. It offers crawlers the power to make anything, a million times over.", "attacks": [["Psychic Tentacle", "INT", 6, "Psychic", "15ft", 0, 1, "Take Down; ongoing psychic until they stand."], ["Telekinetic Throw", "INT", 8, "Bludgeoning", "60ft", 0, 0, "Lifts and hurls a crawler."], ["Dominate", "CHA", 4, "Psychic", "60ft", 0, 1, "After a crawler's turn: CHA check or that crawler acts for it."]], "traits": [["Immune", "Can't be Blinded, Paralyzed, knocked down or Stunned."], ["The Offer", "It would rather bargain than fight. Accepting has a price."]], "clues": ["Its link is the Crown of Domination. Break it.", "It doesn't get tired. End it fast or deal.", "Consequences should be poisoned. Say yes at your peril."], "source": "The Night Before Wintermas, p.11 (5e, converted)", "book": "The Night Before Wintermas"}, {"name": "Jinx", "origin": "Loose Cannon", "page": 2, "role": "skirm", "size": 4, "type": "Humanoid", "tier": "City", "move": "40+S, climb 30", "drAdj": 1, "concept": "A gleefully unhinged gunner with too many guns and traps everywhere. Pushing her emotional buttons makes things worse.", "attacks": [["Pow-Pow", "DEX", 8, "Piercing", "60ft", 0, 0, ""], ["Fishbones", "DEX", 6, "Fire", "Burst 20ft", 1, 0, "Once per turn."], ["Zapper", "DEX", 6, "Lightning", "60ft", 0, 1, "Shocked (slowed) until her next turn."], ["Chompers", "DEX", 6, "Thunder", "Burst 10ft", 1, 1, "The area fills with smoke for a minute."]], "traits": [["Paint the Town Blue", "At the start of each crawler's turn, d20 ≤ 5: a Chomper goes off at their feet."], ["Tortured Soul", "Psychic damage or a failed WIS check sends her berserk: she lashes out twice, rolling d4 for which gun."], ["Slippery", "Bonus disengage, dodge or hide."]], "clues": ["She's vulnerable to psychic damage, but it sets her off.", "Someone she loves can talk her down.", "She sets traps before you arrive."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.2 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}, {"name": "Vi", "origin": "Pit Fighter", "page": 3, "role": "brute", "size": 4, "type": "Humanoid", "tier": "Province", "move": "20+S, climb 30", "drAdj": 1, "concept": "A brawler with giant punching gauntlets. Knock her down once and she gets back up angrier and twice as fast.", "attacks": [["Gauntlet", "STR", 6, "Bludgeoning", "5ft", 0, 1, "Two a turn; shove the target up to double the damage in feet (even upward)."], ["Ground Slam", "STR", 8, "Force", "Burst 30ft", 1, 1, "Recharge 5–6: Take Down and pushed 15 ft."]], "traits": [["Round Two (1/day)", "At 0 HB she refills completely, clears every Debuff, and takes two turns a round."], ["Reckless", "Advantage on her attacks, Advantage against her."], ["Blocking With Her Face", "When hit in melee, she punches back with Advantage."]], "clues": ["Round two is coming. Save something.", "She's protecting someone. Find out who.", "Fight her at range; she has no ranged attack."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.3 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}, {"name": "Caitlyn", "origin": "Sharpshooter", "page": 4, "role": "skirm", "size": 4, "type": "Humanoid", "tier": "City", "move": "20+S", "drAdj": 1, "concept": "A sniper with a rifle that reaches 1,200 ft and called shots that take you apart.", "attacks": [["Rifle", "DEX", 10, "Piercing", "1200ft", 0, 1, "Two shots. Once a turn, Called Shot (CON check): Blinded, can't stand, can't speak/cast, one hand useless, or +8d6 damage to the head."], ["Snap Trap", "DEX", 4, "—", "10ft", 0, 1, "Recharge 4–6: Wrapped (DEX check), hidden from careless eyes."]], "traits": [["Prepared Ground", "If she picks the fight, traps are already down."], ["Eagle Eye", "Almost impossible to sneak up on."]], "clues": ["Close the distance or break line of sight.", "She's lawful. Prove you're innocent and she might stand down.", "Check the floor before you charge."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.4 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}, {"name": "Jayce", "origin": "Hextech Inventor", "page": 5, "role": "brute", "size": 4, "type": "Humanoid", "tier": "City", "move": "20+S", "drAdj": 1, "concept": "An inventor with a hammer that turns into a cannon. His power crystal blows up when he goes down.", "attacks": [["Mercury Hammer", "STR", 6, "Bludgeoning + Force", "5ft", 0, 0, "Three swings a turn."], ["Mercury Cannon", "INT", 6, "Lightning", "Burst 20ft at 120ft", 1, 0, "Twice a turn."]], "traits": [["Lightning Field", "30 ft around him: enemies take +1d6 Lightning whenever hurt; those inside resist damage from outside."], ["Hextech Anomaly", "At 0 HB the crystal goes critical: 2 rounds later it explodes for 20d6 Force within 150 ft (CON halves; cover helps)."]], "clues": ["Run after he drops.", "Steal or disable the crystal.", "He's an idealist. Make him question his side."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.5 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}, {"name": "Ambessa", "origin": "Warlord", "page": 6, "role": "face", "size": 4, "type": "Humanoid", "tier": "City", "move": "20+S", "drAdj": 3, "concept": "A ruthless general with chained blades who fights through her troops, barking a new battle plan every turn.", "attacks": [["Chained Katars", "STR", 8, "Slashing", "15ft", 0, 0, "Three a turn; can swap any for Command."], ["Command", "CHA", 4, "—", "Voice", 0, 1, "An ally moves and attacks with Advantage."]], "traits": [["Ruthless Stratagems", "Each turn pick one: Vision (allies +1d6 on a marked target), Might (allies shove/grapple as a bonus), Guile (one 'soldier' was a mage all along), Sacrifice (allies resist one damage type)."], ["Reinforcements", "Recharge 6: 2d4 thugs come out of cover."]], "clues": ["Cut off her voice and her army falters.", "She always has a trump card. Look for the hidden mage.", "Kill the troops, not the general, first."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.6 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}, {"name": "Rictus", "origin": "Bodyguard", "page": 7, "role": "brute", "size": 5, "type": "Humanoid (giant soldier)", "tier": "City", "move": "20+S", "drAdj": 3, "concept": "A towering, magic-proof bodyguard who throws himself in front of every hit meant for his boss.", "attacks": [["Halberd", "STR", 12, "Slashing", "5ft", 0, 0, "Three swings a turn. +3d6 Force after he resists magic."]], "traits": [["Magic-proof Armor", "Rolls every magic check as CON; each success charges his next hit."], ["Interpose", "Takes any attack or spell aimed at an ally within 15 ft."]], "clues": ["Spells feed him. Use steel.", "He's a shield. Pull him away from who he protects.", "Spread out: he can only cover one target."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.7 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}, {"name": "Warwick", "origin": "Mutant Beast", "page": 8, "role": "brute", "size": 6, "type": "Monstrosity", "tier": "City", "move": "40+S, climb 40", "drAdj": 1, "concept": "A huge chem-wolf hunting in orange fog. He smells blood and can't stop until it's gone.", "attacks": [["Claws", "STR", 12, "Slashing", "5ft", 0, 1, "Two a turn, +1 if the target's below half. Held."], ["Bite", "STR", 12, "Slashing", "5ft", 0, 1, "Only on a Held target. He refills HB equal to the damage."], ["Primal Howl", "CHA", 4, "Psychic", "300ft", 1, 1, "Recharge 6: Terrified."]], "traits": [["Blood Hunter", "Near a wounded crawler he's immune to charm, fear, stun, paralysis and Held."], ["Fumes", "Leaves a growing cloud of orange fog every turn."], ["Blindsight 120 ft", "The fog doesn't slow him."]], "clues": ["Heal up before you engage.", "Wind clears the fog.", "Somewhere in there is a father. Say his old name."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.8 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}, {"name": "Sevika", "origin": "Mechanical-arm Enforcer", "page": 9, "role": "skirm", "size": 4, "type": "Humanoid", "tier": "City", "move": "20+S, climb 30", "drAdj": 1, "concept": "A tough enforcer with a junk-tech arm that does six different things, at random.", "attacks": [["Chomp!", "STR", 12, "Bludgeoning", "30ft", 0, 1, "Pulls the target 30 ft to her."], ["Punch!", "STR", 12, "Bludgeoning", "30ft", 0, 1, "Shoves 15 ft."], ["Flamethrower!", "DEX", 6, "Fire", "Cone 60ft", 1, 0, ""], ["Shurikens!", "DEX", 6, "Piercing", "60ft", 0, 0, "Twice."]], "traits": [["Roll 3d6", "Each turn she rolls 3d6 for her actions: 1 Chomp, 2 Punch, 3 Smoke (hide), 4 Song (annoyed: next hit crits), 5 Flamethrower, 6 Shurikens. Triples: fireworks and an extra turn."], ["Breaking Apart", "Failed check? Sacrifice an arm function (d6) to pass instead."], ["Death Glare", "Advantage against her chosen prey."]], "clues": ["Make her fail checks to break her arm.", "She switches prey every turn. Bait her.", "The arm is the weak point."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.9 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}, {"name": "Singed", "origin": "Chem-baron Scientist", "page": 10, "role": "caster", "size": 4, "type": "Humanoid", "tier": "City", "move": "20+S, climb 30", "drAdj": 0, "concept": "A soft-spoken scientist who throws gas canisters that drive people mad, rot them, or turn them into carriers.", "attacks": [["Throw Diffusers", "INT", 4, "Poison", "3× Burst 20ft at 90ft", 1, 1, "Shimmer Frenzy (attack the nearest creature), Noxious Fumes (ongoing Poison, no healing), or Contagion (you become a gas cloud for others)."], ["Direct Injection", "INT", 6, "Poison", "5ft", 0, 1, "Poisoned by the diffuser of his choice."]], "traits": [["Hold Your Breath", "Starting a turn in gas, close your eyes and cover your mouth: Blinded and mute but safe."], ["Breakable Canisters", "Each canister is a small target; smash it and wind clears the gas."]], "clues": ["Smash the canisters, not the man.", "Fans, wind or open doors beat him.", "He's frail in melee."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.10 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}, {"name": "Ekko", "origin": "Time-skipping Kid", "page": 11, "role": "skirm", "size": 4, "type": "Humanoid", "tier": "City", "move": "20+S, hoverboard fly 40", "drAdj": 1, "concept": "A street-kid genius on a hoverboard who rewinds time. Everyone has to say what they'll do, then he does something about it.", "attacks": [["Bat", "DEX", 8, "Bludgeoning", "5ft", 0, 1, "Three a turn; all three on one target: +4d6 Force and Shocked (slowed)."], ["Timewinder Grenade", "INT", 8, "Force", "Burst 15ft at 60ft", 1, 0, "Area becomes rough terrain."]], "traits": [["Z-Drive", "Each round every crawler announces their move, action and target in advance and must do exactly that (DEX check if impossible, or lose the turn)."], ["Extra Time", "Once a round, takes an extra turn."], ["Hoverboard", "Knock him down and the board flies off."]], "clues": ["Plan as a team out loud. He hears it too.", "Knock him prone to ground him.", "He's a good kid. Talk first."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.11 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}, {"name": "Viktor, the Evolved", "origin": "Ascended Machine Herald", "page": 12, "role": "caster", "size": 5, "type": "Celestial (machine)", "tier": "City", "move": "20+S hover", "drAdj": 2, "concept": "A serene being of pure intellect who wants to 'heal' everyone of their humanity. He can't be hurt. He can only be flawed.", "attacks": [["Heal", "INT", 4, "—", "Touch", 0, 1, "CHA check or the target gains Flaws and obeys him as a trusted ally."], ["Force of Will", "INT", 8, "Force", "120ft", 0, 0, ""]], "traits": [["Ascended Existence", "Uses INT for everything. Immune to all damage and Debuffs."], ["Flaws", "Every miss, failed check or crit he takes gives him a Flaw. Start his turn with 5 and he disappears. He sheds 1 per turn."]], "clues": ["Make him fail: force checks, crit him, make him miss.", "Stack Flaws fast, all in one round.", "Converted crawlers lose their Flaws the same way."], "source": "Unearthed Arcane (Trekiros, Arcane fan content), p.12 (5e, converted)", "book": "Unearthed Arcane (Trekiros, Arcane fan content)"}];

const ADVENTURES={"adv_oracle": {"name": "The Oracle of Shadows", "src": "DM Lair Patreon Feb 2021, p.15–17", "lvl": "Province–Country Boss", "quest": {"summary": "The crawlers looted a lich's tomb and walked out cursed: they're slowly turning undead (a creeping Debuff the System finds hilarious). The only cure is the Oracle of Shadows, deep in the Caves of Ill Omen. She sees your future in your shadow, but first you pass three trials. The last trial is her.", "strongStarts": ["Your crawler's shadow lags half a second behind them. The curse is getting worse.", "A crimson inscription over a cave mouth: three trials, and none fewer, before the Oracle."], "goal": "Collect three shadow gems from the trials, reach the Chamber of Shadows, and beat the Oracle so she lifts the curse.", "stages": [{"name": "Trial: Shroom Cavern", "what": "A burrowing worm-thing erupts under the party. A shadow gem waits where it dies.", "brk": "Victory"}, {"name": "Trial: Tunnels of Fear", "what": "Bone-strewn tunnels and two howling hunters.", "brk": "Cliffhanger"}, {"name": "Trial: Shadow Chains", "what": "A chained obsidian statue; touch it and invisible shadow dancers drop from the ceiling.", "brk": "Victory"}, {"name": "Trial: The Mermaid's Riddles", "what": "Three riddles from a shadow-mouthed merfolk. Any three gems open the final chamber.", "brk": "Cool NPC"}, {"name": "Trial: Shadow Dance-Off", "what": "Out-dance the shadows (CHA checks; players may dance for real to auto-pass).", "brk": "Victory"}, {"name": "The Chamber of Shadows", "what": "The Oracle and five meazels. She flies, disintegrates, counterspells. Win and she lifts the curse.", "brk": "Victory"}], "powerPlayers": [{"name": "The Oracle of Shadows", "want": "Respect earned the hard way.", "live": "Lifts the curse if beaten"}], "items": ["Shadow gems (3 needed to open the final chamber)", "Loot along the way: a love philter, disappearing dust, a healing salve, flying boots, a displacement cloak (roll real loot on the Loot function btState(){return S.bt||(S.bt={cat:"gen",q:"",pick:null})}
function btFilter(type){const B=btState(),q=B.q.toLowerCase(),cats=B.cat==="gen"?(GEN_CATS[type]||[]):B.cat==="all"?null:[B.cat];
  return BT_ALL.filter(x=>(!cats||cats.includes(x.c))&&(!q||(x.t+" "+BOOKTABLES[x.bi].short).toLowerCase().includes(q)))}

async function loadPdfLib(){if(window.PDFLib)return window.PDFLib;await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";s.onload=res;s.onerror=()=>rej(new Error("pdf-lib"));document.head.appendChild(s)});return window.PDFLib}
async function sheetTemplate(){if(S.sheetTpl)return S.sheetTpl;
  try{const r=await fetch("carl-sheet.pdf");if(r.ok){const b=await r.arrayBuffer();if(b.byteLength>10000){S.sheetTpl=b;return b}}}catch(e){}
  return new Promise(res=>{const inp=$("#sheetPdfPick");toast("Pick your blank Carl character sheet PDF");inp.onchange=async()=>{const file=inp.files[0];inp.value="";if(!file)return res(null);S.sheetTpl=await file.arrayBuffer();res(S.sheetTpl)};inp.click()})}
const pdfSafe=s=>String(s??"").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/×/g,"x").replace(/[→]/g,"->").replace(/[•·]/g,"-").replace(/✦|✔|●/g,"").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,"");
function sheetValue(c,k,path){
  if(path[0]==="="){const p=path.slice(1);
    if(p==="hb")return String(k.hbVal);if(p.startsWith("mod."))return sgn(k.mods[p.slice(4)]);if(p.startsWith("modn."))return String(k.mods[p.slice(5)]);if(p==="evade")return String(k.evade);if(p==="dr")return String(k.dr);if(p==="mana")return String(k.mana);
    if(p.startsWith("atkHitMod.")){const i=+p.split(".")[1],a=c.attacks[i];return a.name?String(k.atk[i].hitMod).replace(/^\+/,""):""}
    if(p.startsWith("atkDmgMod.")){const i=+p.split(".")[1],a=c.attacks[i];return a.name?String(k.atk[i].dmgMod).replace(/^\+/,""):""}
    if(p==="petHb")return String(k.petHb);return ""}
  if(/^attacks\.\d+\.rank$/.test(path)&&c.attacks[+path.split(".")[1]].hitTxt)return "";
  if(c.fixed&&(path==="armor"))return String(c.fixed.dr);if(c.fixed&&(path==="drBuffs"||path==="evadeBuffs"))return "";
  if(path==="hbSlot"||path==="mount.hbSlot")return String(c.mount.hbSlot||"");
  if(path==="floor"&&c.kind==="creature")return String(c.floor||"");
  const v=getPath(c,path);return typeof v==="boolean"?v:String(v??"")}
async function fillOfficialPdf(c){
  let lib;try{lib=await loadPdfLib()}catch(e){toast("Couldn't load the PDF tool (needs internet)");return}
  const tpl=await sheetTemplate();if(!tpl){toast("No sheet chosen");return}
  const k=sheetCalc(c),doc=await lib.PDFDocument.load(tpl.slice(0)),form=doc.getForm();let n=0;
  for(const [field,path] of Object.entries(SHEET_MAP)){
    try{const v=sheetValue(c,k,path);
      if(/Check Box/.test(field)){const cb=form.getCheckBox(field);v===true?cb.check():cb.uncheck();continue}
      const tf=form.getTextField(field);const s=pdfSafe(v);if(s){fitField(tf,s);tf.setText(s);n++}else tf.setText("")}catch(e){}}
  const bytes=await doc.save();const fn=`${String(c.name).replace(/[^a-z0-9]+/gi,"-").toLowerCase()||"sheet"}-sheet.pdf`;
  await saveBytes(fn,bytes,"application/pdf");toast(`Filled ${n} fields`)}
function fitField(tf,s){try{const r=tf.acroField.getWidgets()[0].getRectangle(),multi=r.height>28;if(multi)tf.enableMultiline();
  const fit=multi?Math.sqrt((r.width*r.height)/(Math.max(1,s.length)*0.62)):(r.width-4)/(Math.max(1,s.length)*0.52);
  tf.setFontSize(Math.max(4.5,Math.min(multi?10:Math.min(10,r.height*0.62),fit)))}catch(e){}}
async function saveBytes(filename,data,type){const dl=await window.claude?.use?.("downloads")?.catch?.(()=>null);
  if(dl){try{await dl.save({filename,data});return}catch(e){if(e?.code==="declined")return}}
  const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000)}

function aivCtx(f,subject){const m=subject?.kind?subject:null,q=subject?.stages?subject:null;
  const deb=R(DEBUFFS||[["Woozy",""]]);
  return {name:m?.name||"It",level:m?.level||"?",type:m?.type||"",tier:m?.tier||"Neighborhood",floor:f?.number||1,fname:f?.name&&!/^Floor \d+$/.test(f.name)?`: ${f.name}`:"",days:f?.collapseDays||8,hours:f?.clockHours||((f?.collapseDays||8)*24),
   theme:f?.theme?f.theme.replace(/\.?$/,"."):"",atkN:Math.max(1,(m?.attacks||[]).length),atkS:(m?.attacks||[]).length===1?"":"s",
   hobby:R(AIV_FILL.hobby),adj:R(AIV_FILL.adj),formerly:R(AIV_FILL.formerly),lair:R(AIV_FILL.lair),box:R(AIV_FILL.box),kind:R(AIV_FILL.kind),
   debuff:deb[0],debuffFx:deb[1]?(deb[1][0].toUpperCase()+deb[1].slice(1)).replace(/\.?$/,"."):"",qname:q?.name||"A Brand New Problem",qgoal:q?.goal?q.goal.replace(/\.?$/,"."):""}}
const aivFill=(s,x)=>s.replace(/\{(\w+)\}/g,(_,k)=>x[k]??"");
function aiSay(kind,f,subject){const d=AIV[kind],x=aivCtx(f,subject);
  if(kind==="achv"){const [a,b]=R(d.lines);return `New Achievement! ${a}\nReward: ${b}`}
  const pick=(d.lines.length>2?[...d.lines].sort(()=>Math.random()-.5).slice(0,kind==="mob"||kind==="boss"?2:1):[R(d.lines)]).map(s=>aivFill(s,x)).join(" ");
  const tail=d.tail?aivFill(R(d.tail),x):"";
  return ((d.head&&subject?d.head(subject)+"\n":"")+pick+(tail?" "+tail:"")).replace(/ {2,}/g," ").trim()}
function aivBody(kind,f,m){return aiSay(kind,f,m).split("\n").slice(1).join("\n")||aiSay(kind,f,m)}
function vVoice(f){const V=S.voice||(S.voice={kind:"mob",subj:"",out:""});const d=AIV[V.kind];
  const subs=d.need==="mob"?f.mobs.filter(m=>m.kind!=="Boss"):d.need==="boss"?f.mobs.filter(m=>m.kind==="Boss"):d.need==="quest"?f.quests:[];
  return `<section class="panel"><header><h2>System AI voice</h2><span class="dim" style="font-size:12px">What the AI says out loud. Read it in your best game-show voice.</span></header>
   <div class="chips" style="margin-bottom:10px">${Object.entries(AIV).map(([k,v])=>`<button class="chip" aria-pressed="${V.kind===k}" data-act="voiceKind" data-k="${k}">${esc(v.label)}</button>`).join("")}</div>
   <div class="row">${d.need?`<label class="f" style="min-width:220px"><span>${d.need==="quest"?"Quest":d.need==="boss"?"Boss":"Mob"}</span><select id="voiceSubj">${subs.length?subs.map(s=>`<option value="${s.id}" ${s.id===V.subj?"selected":""}>${esc(s.name)}</option>`).join(""):`<option value="">None on this floor yet</option>`}</select></label>`:""}
    <button class="btn gold" data-act="voiceRoll" style="align-self:flex-end">Say it</button>
    ${V.out?`<button class="btn" data-act="voiceCopy" style="align-self:flex-end">Copy</button>`:""}
    ${V.out?`<span style="align-self:flex-end">${speakBtn(V.out,"system")}</span>`:""}
    ${V.out&&S.live?.role==="gm"?`<button class="btn" data-act="announceOpen" data-text="${esc(V.out)}" style="align-self:flex-end">📣 Send to players</button>`:""}
    ${V.out&&(d.need==="mob"||d.need==="boss")&&V.kind!=="bossdown"?`<button class="btn ghost" data-act="voiceSave" style="align-self:flex-end">Save as this ${d.need==="boss"?"Boss":"Mob"}'s announcement</button>`:""}
    ${V.out&&S.sample?`<button class="btn ghost" data-act="voiceClaude" style="align-self:flex-end" ${V.busy?"disabled":""}>✦ Punch it up with Claude</button>`:""}</div>
   ${V.out?`<div class="aibox" style="margin-top:12px"><div class="aihead">SYSTEM MESSAGE</div><div style="white-space:pre-wrap">${esc(V.out)}</div></div>`:`<p class="tip" style="margin-top:10px">Pick a moment and hit <b>Say it</b>. Every roll is different. Mob and Boss intros use the stat block's name, level and tier.</p>`}
  </section>`}

function wzSkills(w){const out=[],seen=new Set(),dup=[];

const d20=()=>1+Math.floor(Math.random()*20);
function advRoll(c,mode){const out=[];c.skills.forEach(s=>{const r=+s.rank||0;if(!s.name||!s.done||!r)return;if(mode==="low"&&r>4)return;if(mode==="high"&&r<5)return;
    const roll=d20();if(roll>=r&&r<15){s.rank=String(r+1);out.push(`${s.name} ${r}→${r+1} (rolled ${roll})`)}else out.push(`${s.name} stays ${r} (rolled ${roll}${r>=15?", capped at 15":""})`);
    s.done=false});
  c.attacks.forEach(a=>{const sk=c.skills.find(s=>s.name&&a.name&&(a.name===s.name||a.name.includes(`(${s.name})`)));if(sk&&!a.hitTxt)a.rank=sk.rank});return out}
function descendSheet(c){const from=+c.floor||1,to=from+1,lines=[];c.floor=String(to);
  const adv=advRoll(c,"high");lines.push(adv.length?`End-of-floor advancement (Rank 5+): ${adv.join("; ")}.`:"No marked Rank 5+ Skills to roll.");
  c.skills.forEach(s=>s.done=false);lines.push("All advancement marks cleared.");
  lines.push("Once-per-floor and once-per-X-days abilities reset; anything lasting 'until you descend' (like Torch) ends.");
  if(to===2)lines.push("Floor 2: viewers can now watch. Popularity, fans and sponsors start here.");
  if(to===3)lines.push("Floor 3: pick a race and a class, spend Stat Points from levels (Unenhanced Stats), and Rank 10/15 Skill Upgrades start working.");
  if(c.uplift?.state==="waiting")lines.push("Still can't speak: nobody has fed the Enhanced Pet Biscuit yet.");
  (c.history=c.history||[]).push(`Floor ${to}: descended from Floor ${from}. ${lines.join(" ")}`);return lines}
function feedBiscuit(c){c.uplift={...(c.uplift||{}),state:"fed"};c.debuffs=String(c.debuffs||"").replace(/Can't speak or use party chat until fed the Enhanced Pet Biscuit;?\s*/,"");
  (c.history=c.history||[]).push(`Floor ${c.floor||1}: ${c.uplift.holder||"A crawler"} fed the Enhanced Pet Biscuit. ${c.name} can talk now (and probably won't stop).`);
  const h=Object.values(S.sheets).find(x=>x.name===c.uplift.holder);if(h){const ix=h.inv.findIndex(i=>/Enhanced Pet Biscuit/i.test(i.item));if(ix>=0){h.inv[ix]={item:"",qty:"",notes:""};saveSheet(h.id)}}}

/* dice: "d20+3", "1d8+2+1d4", "2d6" */
function rollExpr(expr){const parts=[];let total=0,nat=null;const re=/([+-]?)\s*(\d*)d(\d+)|([+-]?)\s*(\d+)/gi;let m;const src=String(expr).replace(/\s+/g,"");
  while((m=re.exec(src))){if(m[3]){const sg=m[1]==="-"?-1:1,n=Math.min(50,+m[2]||1),die=+m[3];const rs=Array.from({length:n},()=>1+Math.floor(Math.random()*die));if(die===20&&n===1&&nat==null)nat=rs[0];
      const sum=rs.reduce((a,b)=>a+b,0)*sg;total+=sum;parts.push(`${sg<0?"−":""}${n}d${die}[${rs.join(",")}]`)}
    else if(m[5]){const v=(m[4]==="-"?-1:1)*+m[5];total+=v;parts.push(v<0?`−${-v}`:`+${v}`)}}
  return {total,parts,nat}}

  if(ex){ex.rank=String(Math.min(15,Math.max(+ex.rank||0,rank)));return}const i=c.skills.findIndex(s=>!s.name);if(i<0)return;c.skills[i]={name,rank:String(rank),stat:st,check:check||"",notes:notes||"",done:false}}

function hasHands(c,race){if(race&&race.id!=="uplifted"&&race.id!=="custom")return true;if(!isAnimal(c))return true;const sp=SPECIES[c.species];return !!(sp&&sp.body==="hands")}

  return {...r,name:`Uplifted ${sp?sp.name:(c.race||"Animal")}`,stats:u[0],ben:[u[1],...r.ben]}}
function rcBlock(c,x,kind,race){if(!x)return "";if(x.who==="human"&&isAnimal(c))return "Humans only";if(x.who==="animal"&&!isAnimal(c))return "Animal crawlers only";
  if(x.req==="hands"&&!hasHands(c,race))return "Needs hands (pick a humanoid race first)";if(x.req==="speech"&&c.uplift?.state==="waiting")return "Needs speech: feed the Enhanced Pet Biscuit first";return ""}

function rcResolve(c,R){let race=R.race?raceFor(c,R.race):null,cls=R.cls?RC_CLASSES.find(x=>x.id===R.cls):null;
  if(race&&race.custom){const q=rcCustom(R,"race");race={...race,name:q.name||"Custom race",stats:{[q.a]:2,...(q.b&&q.b!==q.a?{[q.b]:1}:{})},ben:q.txt?q.txt.split(/\n+/).filter(Boolean):[]}}
  if(cls&&cls.custom){const q=rcCustom(R,"cls");cls={...cls,name:q.name||"Custom class",stats:{[q.a]:2},ab:q.txt?q.txt.split(/\n+/).filter(Boolean):[]}}
  return {race,cls}}
function rcPreview(c,R){const x=snapC(c),{race,cls}=rcResolve(c,R);if(race)applyRace(x,race);if(cls)applyClass(x,cls);STATS.forEach(s=>{if(R.alloc[s])bumpStat(x,s,R.alloc[s])});x.statPts=Math.max(0,(x.statPts||0)-STATS.reduce((t,s)=>t+(R.alloc[s]||0),0));return normSheet(x)}
function applyRace(c,r){const animal=isAnimal(c);
  Object.entries(r.stats||{}).forEach(([s,n])=>bumpStat(c,s,n));if(r.chaMinus)bumpStat(c,"CHA",-r.chaMinus);if(r.dexMinus)bumpStat(c,"DEX",-r.dexMinus);
  if(r.move)c.move=r.move;if(r.size)c.size=r.size;if(r.dr)c.drBuffs=num(c.drBuffs)+r.dr;if(r.pts)c.statPts=(c.statPts||0)+r.pts;
  (r.skills||[]).forEach(([n,rk,st,chk])=>addSkill(c,n,rk,st,chk,`${r.name} race`));
  if(r.id==="uplifted"){c.skills.forEach(s=>{if(/\((Bite|Back Claw|Slice Attack)\)|^(Bite|Back Claw|Slice Attack)$/.test(s.name))s.rank=String(Math.min(15,(+s.rank||0)+2))});c.attacks.forEach(a=>{const sk=c.skills.find(s=>s.name===a.name);if(sk)a.rank=sk.rank});c.race=r.name}
  else{if(animal&&r.id!=="custom")addLine(c.racial,`Body: humanoid now. You have hands and can use weapons and gear (you remember being a ${(SPECIES[c.species]?.name||c.race||"animal").toLowerCase()}).`);c.race=r.name.replace(/ \(stay human\)/,"")}
  c.raceId=r.id;r.ben.forEach(t=>addLine(c.racial,`+ ${t}`));(r.draw||[]).forEach(t=>addLine(c.racial,`− Drawback: ${t}`))}
function applyClass(c,k){Object.entries(k.stats||{}).forEach(([s,n])=>bumpStat(c,s,n));if(k.dr)c.drBuffs=num(c.drBuffs)+k.dr;
  (k.skills||[]).forEach(([n,rk,st,chk,note])=>addSkill(c,n,rk,st,chk,note||`${k.name} class`));
  if(k.atk){const [n,st,dice,ds,fx]=k.atk;if(!c.attacks.some(a=>a.name===n)){const i=c.attacks.findIndex(a=>!a.name);if(i>=0)c.attacks[i]={name:n,rank:String(c.skills.find(s=>s.name===n)?.rank||3),stat:st,dice,dmgStat:ds,effects:fx,hitTxt:""}}}
  (k.inv||[]).forEach(t=>{const i=c.inv.findIndex(x=>!x.item);if(i>=0)c.inv[i]={item:t,qty:"1",notes:`${k.name} starting gear`}});
  c.cls=k.name;c.clsId=k.id;(k.ab||[]).forEach(t=>addLine(c.classAb,t))}
function vRaceClass(){const R=S.rc,c=S.sheets[R.id];if(!c){S.rc=null;return vSheets(F())}const cur=R.step,{race,cls}=rcResolve(c,R);

  const customForm=(kind)=>{const q=rcCustom(R,kind);return `<div class="grid g2" style="gap:10px;margin-top:10px"><label class="f"><span>Name</span><input type="text" data-rc="custom.${kind}.name" value="${esc(q.name)}" placeholder="${kind==="race"?"e.g. a Core Rulebook race":"e.g. a Core Rulebook class"}"></label>
     <label class="f"><span>+2 Stat</span><select data-rc="custom.${kind}.a">${STATS.map(s=>`<option ${q.a===s?"selected":""}>${s}</option>`).join("")}</select></label>${kind==="race"?`<label class="f"><span>+1 Stat</span><select data-rc="custom.${kind}.b">${["",...STATS].map(s=>`<option ${q.b===s?"selected":""}>${s}</option>`).join("")}</select></label>`:""}
     <label class="f" style="grid-column:1/-1"><span>Benefits and drawbacks (one per line)</span><textarea data-rc="custom.${kind}.txt" rows="4">${esc(q.txt)}</textarea></label></div>`};
  if(cur==="race"){left=`<div class="wzlist">${RC_RACES.map((x,i)=>{const y=raceFor(c,x.id),bl=rcBlock(c,y,"race");return bl?"":wzOpt(y.name,Object.entries(y.stats||{}).map(([s,n])=>`${s}+${n}`).join(" ")||(y.pts?`+${y.pts} Stat Points`:y.custom?"Your own":""),"rcPick",`data-k="race" data-v="${x.id}"`,R.race===x.id,(i*31+45)%360)}).join("")}</div>`;
    center=race?`<h3 class="wzh">${esc(race.name)}</h3><p>${esc(race.blurb)}</p>${pills(race)}
      ${race.custom?customForm("race"):`<div class="spcols"><div><small>Benefits</small><ul>${race.ben.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div><div><small>Drawbacks</small><ul>${(race.draw||[]).map(t=>`<li>${esc(t)}</li>`).join("")||"<li>None</li>"}</ul></div></div>`}
      ${isAnimal(c)&&race.id!=="uplifted"&&!race.custom?`<p class="tip">Picking a humanoid race gives ${esc(c.name)} hands. Weapon classes open up.</p>`:""}`
     :`<h3 class="wzh">Choose your race</h3><p>Welcome to the Third Floor. The System lets you become something new, or stay what you are. Every race has a cost.</p>`}
  if(cur==="cls"){left=`<div class="wzlist">${RC_CLASSES.map((x,i)=>{const bl=rcBlock(c,x,"cls",race);if(x.who==="animal"&&!isAnimal(c))return "";return wzOpt(x.name,bl||Object.entries(x.stats||{}).map(([s,n])=>`${s}+${n}`).join(" ")||"Your own","rcPick",`data-k="cls" data-v="${x.id}" ${bl?"disabled":""}`,R.cls===x.id,(i*29+265)%360)}).join("")}</div>`;
    center=cls?`<h3 class="wzh">${esc(cls.name)}</h3><p>${esc(cls.blurb)}</p>${pills(cls)}${cls.custom?customForm("cls"):`<div class="eyebrow" style="margin-top:10px">Class abilities</div><ul class="featl">${cls.ab.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>${cls.inv?`<div class="wzpills"><span>Gear: ${esc(cls.inv.join(", "))}</span></div>`:""}`}`
     :`<h3 class="wzh">Choose your class</h3><p>Your class decides how you'll kill things from here down. Greyed-out classes say what they need.</p>`}
  if(cur==="stats"){center=`<h3 class="wzh">Stat Points</h3><p>${ptsLeft+STATS.reduce((t,s)=>t+(R.alloc[s]||0),0)} to spend${(c.statPts||0)?` (${c.statPts} from levels, house rule)`:""}${race?.pts?`, +${race.pts} from being Human`:""}. Each point raises a Stat by 1. <b>${ptsLeft}</b> left.</p>${allocGrid(rcPreview(c,{...R,alloc:{}}),R.alloc,"rcAlloc",ptsLeft)}
    ${houseBox()}`;left=wzOpt("Race",race?race.name:"Not picked","rcStep",`data-k="race"`,!!race,45)+wzOpt("Class",cls?cls.name:"Not picked","rcStep",`data-k="cls"`,!!cls,265)}
  if(cur==="review"){const d=diffC(normSheet(snapC(c)),pv);left=RC_STEPS.slice(0,-1).map(([k,l],i)=>wzOpt(l,done[k]?"Done":"Needs attention","rcStep",`data-k="${k}"`,done[k],done[k]?140:0)).join("");
    center=`<h3 class="wzh">${esc(c.name)}: ${esc(race?.name||"?")} ${esc(cls?.name||"?")}</h3><p>Here's everything that changes.</p>${diffTable(d)}`}
  const i=RC_STEPS.findIndex(x=>x[0]===cur),ok=race&&cls;
  return `<section class="wz panel rcwiz"><div class="wztop"><div class="wzbans">${bans}</div><div class="wzside"><button class="linkish" data-act="rcExit">✕ Later</button><button class="btn gold sm" data-act="rcApply" ${ok?"":"disabled"}>✓ Confirm</button></div></div>

    <div class="row" style="margin-top:18px;justify-content:space-between">${i>0?`<button class="btn ghost" data-act="rcStep" data-k="${RC_STEPS[i-1][0]}">← ${RC_STEPS[i-1][1]}</button>`:"<span></span>"}${i<RC_STEPS.length-1?`<button class="btn gold" data-act="rcStep" data-k="${RC_STEPS[i+1][0]}">${RC_STEPS[i+1][1]} →</button>`:`<button class="btn gold" data-act="rcApply" ${ok?"":"disabled"}>✓ Confirm race & class</button>`}</div></div>

    <div class="wzmini">${STATS.map(s=>`<div><small>${s}</small><b>${pv.stats[s].e}</b><i>${sgn(kp.mods[s])}</i></div>`).join("")}</div><div class="dim mono" style="font-size:12px;margin-top:6px">Move ${esc(pv.move)} · Size ${esc(pv.size)} · DR ${esc(kp.dr)} · Mana ${kp.mana}</div></div></div></section>`}

const PLAYER_BUILD=typeof window.PLAYER_BUILD!=="undefined"&&window.PLAYER_BUILD===true;
async function packSheet(c){const js=JSON.stringify({v:1,sheet:c});let bytes=new TextEncoder().encode(js),tag="J";
  try{if(window.CompressionStream){const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));bytes=new Uint8Array(await new Response(cs).arrayBuffer());tag="Z"}}catch(_){bytes=new TextEncoder().encode(js);tag="J"}
  let b="";for(let i=0;i<bytes.length;i+=8192)b+=String.fromCharCode(...bytes.subarray(i,i+8192));return `DCC${tag}:`+btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function unpackSheet(code){const m=String(code).replace(/\s+/g,"").match(/DCC([JZ]):([A-Za-z0-9_-]+)/);if(!m)throw new Error("format");let t=m[2].replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";
  let bytes=Uint8Array.from(atob(t),ch=>ch.charCodeAt(0));if(m[1]==="Z"){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
  const d=JSON.parse(new TextDecoder().decode(bytes));if(!d||!d.sheet||!d.sheet.stats)throw new Error("format");return normSheet(d.sheet)}
function sharePop(){const P=S.pop;if(P.mode==="share")return `<p>${PLAYER_BUILD?"Send this code to your GM (text, Discord, email). It holds your whole character.":"Send this code to the player. In their Player app they tap <b>Load from GM</b> and paste it."}</p>
   <textarea id="shareCode" rows="5" readonly style="font-family:var(--f-mono);font-size:12px;word-break:break-all">${esc(P.code||"Building…")}</textarea>
   <div class="row" style="margin-top:10px;justify-content:flex-end">${navigator.share?`<button class="btn" data-act="shareNative">Share…</button>`:""}<button class="btn gold" data-act="shareCopy">Copy code</button></div>`;
  return `<p>${PLAYER_BUILD?"Paste the code your GM sent you.":"Paste the code a player sent you."} A sheet with the same crawler is replaced; otherwise it's added.</p>
   <textarea id="loadCode" rows="5" placeholder="DCCZ:…" style="font-family:var(--f-mono);font-size:12px"></textarea>${P.err?`<p class="tip" style="border-color:var(--bad);margin-top:8px">${esc(P.err)}</p>`:""}
   <div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn gold" data-act="loadApply">Load character</button></div>`}
async function driveBackup(btn){let mcp=null;try{mcp=await window.claude?.use?.("mcp")}catch(_){mcp=null}
  if(!mcp){if(S.live?.role==="gm")return liveDriveBackup(btn);const nm=downloadBackup();toast("Backup saved to this device: "+nm);return}
  const D="Google Drive";if(btn){btn.disabled=true;btn.textContent="Backing up…"}

/* ===================== BACKUP: Google Drive from the web version, file download everywhere ===================== */
function backupBody(){const now=new Date(),stamp=now.toISOString().slice(0,16).replace("T"," ").replace(":","");
  return {name:`Floor Builder backup ${stamp}.json`,body:JSON.stringify({kind:"floor-builder-backup",v:1,savedAt:now.toISOString(),floors:S.floors,sheets:S.sheets})}}
function downloadBackup(){const {name,body}=backupBody();const u=URL.createObjectURL(new Blob([body],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return name}
async function driveErr(r){let j={};try{j=await r.json()}catch(_){}const t=JSON.stringify(j);return {status:r.status,disabled:/has not been used|is disabled|SERVICE_DISABLED|accessNotConfigured/i.test(t),msg:j.error?.message||""}}
async function liveDriveBackup(btn){const fb=S.fb,u=fb?.auth?.currentUser;
  if(!u||u.isAnonymous){downloadBackup();toast("Backup saved to this device. Sign in with Google to back up to Drive.");return}
  if(btn){btn.disabled=true;btn.textContent="Backing up…"}
  try{let tok=S.driveTok&&S.driveTok.exp>Date.now()?S.driveTok.t:null;
    if(!tok){const p=new fb.Au.GoogleAuthProvider();p.addScope("https://www.googleapis.com/auth/drive.file");try{p.setCustomParameters({login_hint:u.email||""})}catch(_){}
      const r=await fb.Au.reauthenticateWithPopup(u,p);tok=fb.Au.GoogleAuthProvider.credentialFromResult(r)?.accessToken;if(!tok)throw {code:"no-token"};S.driveTok={t:tok,exp:Date.now()+50*60e3}}
    const H={Authorization:"Bearer "+tok},G="https://www.googleapis.com";
    const q=encodeURIComponent("name='Floor Builder Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    let r=await fetch(`${G}/drive/v3/files?q=${q}&fields=files(id,webViewLink)`,{headers:H});if(!r.ok)throw await driveErr(r);
    let folder=((await r.json()).files||[])[0];
    if(!folder){r=await fetch(`${G}/drive/v3/files?fields=id,webViewLink`,{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({name:"Floor Builder Backups",mimeType:"application/vnd.google-apps.folder"})});if(!r.ok)throw await driveErr(r);folder=await r.json()}
    const {name,body}=backupBody(),bd="fbk"+Math.random().toString(36).slice(2);
    const multi=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:[folder.id],mimeType:"application/json"})}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
    r=await fetch(`${G}/upload/drive/v3/files?uploadType=multipart&fields=id`,{method:"POST",headers:{...H,"Content-Type":"multipart/related; boundary="+bd},body:multi});if(!r.ok)throw await driveErr(r);
    S.lastBackup={at:Date.now(),url:folder.webViewLink||""};try{localStorage.setItem("floorbuilder.lastBackup",JSON.stringify(S.lastBackup))}catch(_){}
    toast(`Backed up ${Object.keys(S.floors).length} floors and ${Object.keys(S.sheets).length} sheets to Google Drive`)}
  catch(e){const code=String(e?.code||"");if(e?.status===401)S.driveTok=null;
    if(/popup-closed|cancelled-popup|user-cancelled/.test(code)){toast("Backup cancelled");return}
    if(/user-mismatch/.test(code)){toast("Pick the same Google account you signed in with");return}
    if(/popup-blocked/.test(code)){toast("Your browser blocked the Google window. Allow pop-ups for this site, then try again.");return}
    const name=downloadBackup();
    if(e?.disabled){S.pop={mode:"info",title:"Turn on Google Drive (one time)",html:`<p>Your backup was saved to this device as <b>${esc(name)}</b>.</p><p>To send backups straight to Google Drive, turn on the Drive API for your Firebase project once:</p><ol><li>Open <a href="https://console.cloud.google.com/apis/library/drive.googleapis.com?project=dcc-campaign" target="_blank" rel="noopener">Google Drive API for dcc-campaign</a>.</li><li>Tap <b>Enable</b>.</li><li>Wait a minute, then tap <b>Back up to Drive</b> again.</li></ol>`};renderPop()}
    else toast("Drive didn't answer, so the backup was saved to this device instead")}
  finally{renderBackupBtn()}}

/* ===================== GEAR & BUFF MATH ===================== */
const DTYPES=["Acid","Bludgeoning","Electric","Fire","Force","Holy","Ice","Necrotic","Piercing","Poison","Psychic","Slashing","Sonic"];
const TYPE_ALIAS={cold:"Ice",frost:"Ice",lightning:"Electric",thunder:"Sonic",radiant:"Holy"};
function normType(t){t=String(t||"").trim();if(!t)return "";const l=t.toLowerCase();if(TYPE_ALIAS[l])return TYPE_ALIAS[l];return DTYPES.find(x=>x.toLowerCase()===l)||""}
const GEAR_LABEL={head:"Head",torso:"Torso",arms:"Arms",hands:"Hands",legs:"Legs",feet:"Feet",acc:"Accessories"};
const BUFF_KEY=w=>{w=w.toLowerCase().replace(/\s+/g," ");if(/^str/.test(w))return "STR";if(/^int/.test(w))return "INT";if(/^con/.test(w))return "CON";if(/^dex/.test(w))return "DEX";if(/^cha/.test(w))return "CHA";
  if(w==="dr"||/^damage res/.test(w))return "dr";if(/^evade/.test(w))return "evade";if(/^(move|movement|speed)/.test(w))return "move";return ""};
const BUFF_WORDS="Str(?:ength)?|Int(?:elligence)?|Con(?:stitution)?|Dex(?:terity)?|Cha(?:risma)?|DR|Damage Resistance|Evade|Move(?:ment)?|Speed";
const TYPE_WORDS=DTYPES.join("|")+"|Cold|Frost|Lightning|Thunder|Radiant";
function gearBuffs(c){const o={stat:{STR:0,INT:0,CON:0,DEX:0,CHA:0},dr:0,evade:0,move:0,res:new Set(),imm:new Set(),vul:new Set(),src:[]};
  const srcs=[...Object.entries(c.gear||{}).map(([k,v])=>[GEAR_LABEL[k]||k,v]),...(c.ext||[]).map(v=>["External Buff",v])];
  srcs.forEach(([slot,txt])=>{let t=String(txt||"");if(!t.trim())return;const hit=[];
    const add=(sign,n,w)=>{const k=BUFF_KEY(w),v=(sign==="-"||sign==="−"?-1:1)*(+n||0);if(!k||!v)return;if(o.stat[k]!=null)o.stat[k]+=v;else o[k]+=v;hit.push(`${v>0?"+":""}${v} ${k.length===3?k:k==="dr"?"DR":k[0].toUpperCase()+k.slice(1)}`)};
    t=t.replace(new RegExp(`([+\\-−])\\s?(\\d+)\\s*(?:to\\s+)?(?:your\\s+)?(${BUFF_WORDS})\\b`,"gi"),(m,sg,n,w)=>{add(sg,n,w);return " "});
    t.replace(new RegExp(`\\b(${BUFF_WORDS})\\s*([+\\-−])\\s?(\\d+)`,"gi"),(m,w,sg,n)=>{add(sg,n,w);return " "});
    const kind=w=>/^res/i.test(w)?"res":/^imm/i.test(w)?"imm":"vul";
    String(txt).replace(new RegExp(`\\b(${TYPE_WORDS})\\s+(Resistance|Resistant|Immunity|Immune|Vulnerability|Vulnerable)\\b`,"gi"),(m,ty,w)=>{const T=normType(ty);if(T){o[kind(w)].add(T);hit.push(`${T} ${kind(w)==="res"?"Resistance":kind(w)==="imm"?"Immunity":"Vulnerability"}`)}return m});
    String(txt).replace(new RegExp(`\\b(Resist(?:ance|ant)?|Immun(?:e|ity)|Vulnerab(?:le|ility))\\s+(?:to\\s+)?(${TYPE_WORDS})\\b`,"gi"),(m,w,ty)=>{const T=normType(ty);if(T&&!o[kind(w)].has(T)){o[kind(w)].add(T);hit.push(`${T} ${kind(w)==="res"?"Resistance":kind(w)==="imm"?"Immunity":"Vulnerability"}`)}return m});
    if(hit.length)o.src.push({slot,what:String(txt).split(/\n/)[0].slice(0,60),fx:hit})});
  return o}
function gearLine(c,k){const g=k.gb;if(!g||!g.src.length)return "";
  return `<div class="ddb-cond gearline"><small>From gear & buffs</small> ${g.src.map(s=>`<span class="gtag" title="${esc(s.slot)}: ${esc(s.what)}">${esc(s.fx.join(", "))}</span>`).join("")}</div>`}

/* ===================== DAMAGE (Rules for Survival p.42) ===================== */
function applyDamage(c,amount,type){const k=sheetCalc(c),T=normType(type),per=Math.max(1,num(k.hbVal)||1),steps=[];let d=Math.max(0,Math.round(+amount||0));
  steps.push(`${d}${T?" "+T:""} damage`);
  const dr=num(k.dr);if(dr&&d){d=Math.max(0,d-dr);steps.push(`−${dr} DR = ${d}`)}
  if(T&&k.gb.imm.has(T)){if(d)steps.push(`Immune to ${T}: 0`);d=0}
  else{if(T&&k.gb.res.has(T)&&d){d=Math.floor(d/2);steps.push(`${T} Resistance halves it: ${d}`)}if(T&&k.gb.vul.has(T)&&d){d*=2;steps.push(`Vulnerable to ${T}: ${d}`)}}
  const before=k.left,slots=Math.min(before,Math.floor(d/per));if(d>0&&d<per)steps.push(`less than one slot (${per}), so no Health lost`);
  let left=slots;for(let i=k.slots-1;i>=0&&left>0;i--)if(!c.hbLost[i]){c.hbLost[i]=true;left--}
  const dying=c.kind==="crawler"&&before>0&&before-slots<=0;if(dying&&!/Dying/.test(c.debuffs||""))c.debuffs=[c.debuffs,"Dying"].filter(Boolean).join("; ");
  return {final:d,slots,steps,dying,left:before-slots,per}}

function cbInput(t,commit){const C=cbState(),key=t.dataset.cb;let v=t.type==="checkbox"?t.checked:t.value;
  if(key.startsWith("tg.")){const [,id,fld]=key.split(".");C.tg[id]=C.tg[id]||{mode:"auto"};C.tg[id][fld]=v}else C[key]=v;
  if(key==="src")C.atk="0";
  if(key==="trap"){const tr=cbTraps(F()).find(x=>x.key===v);if(tr){const e=tr.effect||"";C.dmgExpr=(e.match(/\d+d\d+(?:\s*[+-]\s*\d+)?/i)||[""])[0].replace(/\s+/g,"");C.dmgType=normType((e.match(new RegExp(TYPE_WORDS,"i"))||[""])[0])}}
  if(commit&&(t.tagName==="SELECT"||t.type==="checkbox"))keepFocus(renderMain)}
function cbResolve(){const C=cbState(),f=F();let A;
  if(C.kind==="mob"){const src=cbSources(f).find(s=>s.key===C.src),a=src?.atks[+C.atk]||src?.atks[0];if(!a){toast("Pick a monster and an attack");return}
    const aoe=C.aoe||a.aoe;A={title:`${src.name}: ${a.name}`,who:src.name,what:a.name,expr:a.dmg,type:a.type,check:"evade",dc:a.dc,onSave:aoe?"half":"none",aoe,voice:src.boss?"boss":"monster",major:true}}
  else{const tr=cbTraps(f).find(x=>x.key===C.trap);const nm=tr?.name||C.trapName||"Trap";A={title:`Trap: ${nm}`,who:nm,what:"",expr:C.dmgExpr||`${f.number}d6`,type:C.dmgType,check:C.check,dc:num(C.dc)||10+(+f.number||0),onSave:C.onSave,voice:"system",major:false}}
  const ids=Object.entries(C.tg).filter(([id,T])=>T.on&&S.sheets[id]).map(([id])=>id);if(!ids.length){toast("Tap at least one crawler");return}
  let total,rollTxt;if(C.dmgMode==="manual"){if(C.dmgVal===""){toast("Enter the damage total");return}total=num(C.dmgVal);rollTxt=`${total} damage`}else{const r=rollExpr(A.expr);total=r.total;rollTxt=`${A.expr}: ${r.parts.join(" ").replace(/^\+/,"")} = ${total}`}
  const L={id:uid(),title:A.title,roll:rollTxt,rows:[],undo:{}};
  ids.forEach(id=>{const c=S.sheets[id],k=sheetCalc(c),T=C.tg[id],mode=T.mode||"auto";let dmg=total,outcome="";
    if(A.check!=="none"&&!(A.check==="evade"&&mode==="none")){let tot,nat=null;
      if(mode==="manual"){if(T.roll===""||T.roll==null){outcome="No roll entered, so it hits";tot=null}else tot=num(T.roll)}
      else{const mod=A.check==="evade"?cbEvMod(c,k):(k.mods[A.check]||0);const r=rollExpr(`d20${sgn(mod)}`);tot=r.total;nat=r.nat}
      if(tot!=null){const ok=nat!==1&&tot>=A.dc,lbl=A.check==="evade"?"Evade":STAT_NAME[A.check];
        if(ok){dmg=A.onSave==="half"?Math.floor(dmg/2):0;outcome=`${lbl} ${tot} vs ${A.dc}: success${A.onSave==="half"?", half damage":""}`}
        else{outcome=`${lbl} ${tot} vs ${A.dc}: ${nat===1?"Natural 1":"failed"}`;if(A.major&&A.check==="evade"&&(nat===1||A.dc-tot>=10)){dmg+=+f.number||0;outcome+=`, Major Fail +${f.number} damage`}}}}
    else if(A.check==="evade")outcome="Didn't evade";
    L.undo[id]={hbLost:c.hbLost.slice(),debuffs:c.debuffs||""};
    const R=dmg>0?applyDamage(c,dmg,A.type):{final:0,slots:0,steps:[],dying:false,left:k.left};
    if(R.slots>0&&C.debuff.trim()&&!String(c.debuffs||"").includes(C.debuff.trim()))c.debuffs=[c.debuffs,C.debuff.trim()].filter(Boolean).join("; ");

    const say=`${A.who}${A.what?` uses ${A.what}`:""}${C.kind==="trap"?" springs":""}! ${outcome?outcome+". ":""}${R.steps.length?R.steps.join(", ")+". ":"No damage. "}${R.slots?`You lose ${R.slots} Health Bar slot${R.slots>1?"s":""}.`:"You keep all your Health."}${R.slots&&C.debuff.trim()?` You gain the ${C.debuff.trim()} Debuff.`:""}${R.dying?" You are DYING. Get healed to 10% or you die.":""}`;
    livePushEvent({type:"hit",title:A.title,text:say,voice:A.voice,targets:[id],slots:R.slots,dying:R.dying})});

function cbUndo(id){const C=cbState(),L=C.log.find(x=>x.id===id);if(!L||L.undone)return;Object.entries(L.undo).forEach(([cid,u])=>{const c=S.sheets[cid];if(!c)return;c.hbLost=u.hbLost.slice();c.debuffs=u.debuffs;saveSheet(cid)});

function combatAct(a,el){switch(a){

  g.ctl=new AbortController();
  try{g.full=await S.sample.json(prompt,{modelTier:"default",signal:g.ctl.signal,cache:false});g.fullType=g.type}
  catch(e){g.err=e?.code==="not_granted"?"Claude access wasn't allowed for this page. You can still use the rolls as-is.":e?.code==="cancelled"?"Stopped.":e?.code==="rate_limited"?"Too many requests right now. Try again in a minute.":"Claude couldn't finish that write-up. Try again, or use the rolls as-is."}
  g.busy=false;renderMain();
}
function genAddFull(f){
  const x=S.gen.full,t=S.gen.fullType,F=+f.number;if(!x)return;let msg="";
  const mkBoss=(b,tier)=>b?bossStub(f,b.name||"Boss",tier,{level:+b.level||bossRange(F,tier)[0],announce:b.announce||"",clues:[b.weakness||""],notes:b.want||""}):null;
  if(t==="town"){const n=blankNb(x.name||S.gen.res.name,"Generated + Claude");
    ["theme","summary","environment"].forEach(k=>x[k]&&(n[k]=x[k]));
    ["strongStarts","storyArcs","items","mesh"].forEach(k=>Array.isArray(x[k])&&(n[k]=x[k].map(String)));
    if(Array.isArray(x.traps))n.traps=x.traps;if(Array.isArray(x.grinding))n.grinding=x.grinding.slice(0,6).map(String).concat(Array(6).fill("")).slice(0,6);
    if(Array.isArray(x.quarters))n.quarters=x.quarters;if(Array.isArray(x.npcs))n.npcs=x.npcs;if(Array.isArray(x.achievements))n.achievements=x.achievements;
    const b=mkBoss(x.boss,"Neighborhood");if(b){n.boss=b.id;n.bossNotes=`${x.boss.want||""} Weakness: ${x.boss.weakness||""}`}
    n.status="prepped";f.neighborhoods.push(n);S.open["nb"+n.id]=true;msg=`${n.name} added, fully written`}
  else if(t==="quest"){const q=blankQuest(x.name||S.gen.res.name,"Generated + Claude");
    ["summary","goal","clock","ignore"].forEach(k=>x[k]&&(q[k]=x[k]));["strongStarts","items"].forEach(k=>Array.isArray(x[k])&&(q[k]=x[k].map(String)));
    ["stages","powerPlayers","achievements"].forEach(k=>Array.isArray(x[k])&&(q[k]=x[k]));q.status="prepped";f.quests.push(q);S.open["q"+q.id]=true;msg=`${q.name} added`}
  else if(t==="city"||t==="borough"){const tier=t==="city"?"City":"Borough",nm=S.gen.res.name;
    (x.neighborhoods||[]).forEach(h=>{const n=blankNb(h.name,`${tier}: ${nm}`);n.theme=h.theme||"";n.summary=h.summary||"";n.strongStarts=[h.strongStart||""];n.neighbors=x.overview||"";f.neighborhoods.push(n)});
    mkBoss(x.boss,tier);msg=`${nm}: ${(x.neighborhoods||[]).length} Neighborhoods added`}
  else{const isBoss=t!=="mob";const m=isBoss?bossStub(f,x.name||S.gen.res.name,S.gen.res.tier||"Neighborhood"):blankMob("Mob");
    if(!isBoss){m.level=+S.gen.res.level||m.level;f.mobs.push(m);spread(m,S.gen.res.role||"even")}
    Object.assign(m,{name:x.name||m.name,announce:x.announce||"",notes:x.notes||"",clues:Array.isArray(x.clues)?x.clues.map(String):m.clues});
    if(Array.isArray(x.attacks)&&x.attacks.length)m.attacks=x.attacks.map(a=>({name:a.name||"Attack",stat:STATS.includes(a.stat)?a.stat:"STR",die:[4,6,8,10,12].includes(+a.die)?+a.die:6,type:a.type||"",range:a.range||"5ft",area:!!a.area,rider:!!a.rider,effect:a.effect||""}));
    S.mobSel=m.id;msg=`${m.name} is in the Mob Forge`}
  S.gen.full=null;scheduleSave();toast(msg);renderShell();renderMain();
}


/* ===================== RANDOM FLOOR ===================== */
const FLOOR_T={
 name:["The Night Market","The Undercroft","The Carnival of Teeth","The Sunken Mall","The Clockwork Suburbs","The Fungal Commons","The Glass Archipelago","The Endless Convention","The Iron Orchard","The Velvet Catacombs","The Storm Bazaar","The Hollow Stadium","The Gilded Sewers","The Midnight Motorway","The Bone Prairie"],
 pitch:["Everything is for sale, including you","A whole floor built as one giant game show","The architects got lazy and copy-pasted a suburb ten thousand times","Two god-backed factions at war; pick a side or get crushed","Day lasts an hour; night lasts nine","The floor slowly floods from the bottom up","Every Neighborhood is a different decade","The Bosses are celebrities with fan clubs","It's beautiful, and the beauty is the trap","Rules change each time the timer passes a day"],
 janitor:["Mop Wraiths","Trash Weasels","Roomba Swarms","Bleach Golems","Gutter Moths","Sanitation Slimes","Broom Goblins","Vacuum Hounds"],
 stairs:["under a Borough Boss's lair","behind a reward room that opens at midnight","in the busiest saferoom (guarded)","at the bottom of a flooded quarter","inside a Quest's final location","on a moving vehicle that loops the floor"],
 features:{tutorial:"Hallways and rooms; no night. Bosses hold Boss rooms.",overcity:"Day/night cycle. Elites walk the streets.",tangle:"Rail lines connect everything; trains are both transport and hazard.",bubbles:"Quadrant bubbles (Land, Air, Sea, Subterranean) with factions at war.",any:"Anything goes. The architects had a theme and abandoned it halfway."}
};
function randomFloor(n,opts={}){
  n=Math.max(1,+n||1);const flavor=floorFlavor(n),b=BOOK[n];
  const f=blankFloor(n);f.partySize=F()?.partySize||4;
  f.name=b?b.name:R(FLOOR_T.name);f.theme=R(FLOOR_T.pitch);
  if(!b){f.collapseDays=Math.min(20,8+Math.floor(n/2)+Math.floor(Math.random()*3));f.clockHours=f.collapseDays*24;f.janitor=R(FLOOR_T.janitor);f.features=FLOOR_T.features[flavor]}
  const nbCount=opts.nbs||5,used=new Set();
  // optionally mix in book Neighborhoods as stubs (up to 2)
  if(opts.book&&b?.nb?.length){RN(b.nb,Math.min(2,b.nb.length)).forEach(([nm,src])=>{f.neighborhoods.push(blankNb(nm,src));used.add(nm)})}
  while(f.neighborhoods.length<nbCount){const r=rollAll("town",n,flavor);if(used.has(r.name))continue;used.add(r.name);
    const nb=nbFromTown(f,r,"Random floor");
    for(let i=1;i<6;i++)nb.grinding[i]=rollField("grind","one",{F:n,flavor,cur:{}});
    const t2=rollAll("trap",n,flavor);nb.traps.push({name:t2.trigger,detect:t2.detect,effect:t2.effect});
    const np=rollAll("npc",n,flavor);nb.npcs.push({name:np.name,want:`${np.kind}. ${np.want}. Secret: ${np.secret}.`,stance:R(["Friendly","Neutral","Hostile"])});
    f.neighborhoods.push(nb)}
  // Mobs: 1-2 per generated Neighborhood
  f.neighborhoods.filter(x=>x.source==="Random floor").forEach(nb=>{const k=1+(Math.random()<.5?1:0);for(let i=0;i<k;i++){const r=rollAll("mob",n,flavor);const m=blankMob("Mob");
    Object.assign(m,{name:r.name,level:+r.level,floor:n,notes:r.behavior+".",clues:[r.weak]});spread(m,r.role);f.mobs.push(m);nb.mobs.push(m.id)}});
  // Borough Boss over the first half of the Neighborhoods
  const br=rollAll("borough",n,flavor);const bb=bossStub(f,stripLv(br.boss),"Borough",{notes:`Rules ${br.name}. ${cap(br.conflict)}.`});
  f.neighborhoods.slice(0,Math.ceil(nbCount/2)).forEach(nb=>{nb.neighbors=`Part of ${br.name}, under ${bb.name}. ${cap(br.conflict)}.`});
  // Quests
  for(let i=0;i<(opts.qs||2);i++){let r=rollAll("quest",n,flavor),tries=0;while(f.quests.some(x=>x.name===r.name||x.goal===r.type)&&tries++<20)r=rollAll("quest",n,flavor);const q=blankQuest(r.name,"Random floor");
    Object.assign(q,{summary:`${r.type} quest. ${r.giver}. ${r.twist}.`,strongStarts:[r.start],goal:r.type,
      stages:r.stages.split("\n").map((s,j,a)=>({name:`Stage ${j+1}`,what:s.replace(/^\d+\. /,""),brk:j===a.length-1?"Victory":"Cliffhanger"})),
      powerPlayers:[{name:r.elite.split(",")[0],want:"",live:r.elite.split(", who ")[1]||""}],clock:r.clock,items:[r.reward],ignore:"On failure: "+r.fail,
      links:R(f.neighborhoods).name});f.quests.push(q)}
  // Stairwells
  RN(FLOOR_T.stairs,2).forEach(w=>f.stairwells.push({where:cap(w),status:"Hidden",how:""}));
  f.notes="Rolled with the random floor generator. Reroll anything you don't like from the Generator tab.";
  return f;
}
/* ===================== BOOT ===================== */
/* floors/sheets saved in this browser while cloud save was off: offer to upload them */
function localLeftovers(cloudFloors){let lf={},ls={};try{lf=JSON.parse(localStorage.getItem(LS)||"null")||{}}catch(_){}try{ls=JSON.parse(localStorage.getItem(LS_SHEETS)||"null")||{}}catch(_){}
  const fl=Object.entries(lf).filter(([id])=>!cloudFloors[id]&&!S.floors[id]),sh=Object.entries(ls).filter(([id])=>!S.sheets[id]);return {fl,sh}}
function offerLocalUpload(cloudFloors){const {fl,sh}=localLeftovers(cloudFloors);if(!fl.length&&!sh.length)return;$("#localUp")?.remove();
  $("#main").insertAdjacentHTML("beforebegin",`<div class="banner" id="localUp" style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:220px">Found ${fl.length?`${fl.length} floor${fl.length>1?"s":""}`:""}${fl.length&&sh.length?" and ":""}${sh.length?`${sh.length} sheet${sh.length>1?"s":""}`:""} saved only in this browser (${esc([...fl.map(([,f])=>`Floor ${f.number} · ${f.name}`),...sh.map(([,c])=>c.name)].slice(0,4).join(", "))}${fl.length+sh.length>4?"…":""}). Upload to cloud save?</span><button class="btn sm gold" data-act="localUpload">Upload</button><button class="btn sm ghost" data-act="localDismiss">Not now</button></div>`)}
function normalize(fl){const b=blankFloor(fl.number||1);const out={...b,...fl};
  out.neighborhoods=(fl.neighborhoods||[]).map(n=>({...blankNb(),...n}));out.quests=(fl.quests||[]).map(q=>({...blankQuest(),...q}));
  out.mobs=(fl.mobs||[]).map(m=>({...{name:"",kind:"Mob",tier:"Neighborhood",size:4,type:"",level:1,floor:out.number,stats:{STR:1,INT:1,CON:1,DEX:1,CHA:1},move:"20+S",drAdj:0,homeFloor:"",announce:"",attacks:[],traits:[],clues:[],notes:""},...m}));
  out.loot=Array.isArray(fl.loot)?fl.loot:[];out.spice=out.spice||{};out.prep=out.prep||{};out.stairwells=out.stairwells||[];return out}
function applyFloors(map){S.floors={};Object.entries(map).forEach(([id,d])=>S.floors[id]=normalize({...d,id}));if(!S.floors[S.cur])S.cur=Object.keys(S.floors).sort((a,b)=>S.floors[a].number-S.floors[b].number)[0]||null}
function editing(){const a=document.activeElement;return a&&a.closest&&a.closest("#main")&&/INPUT|TEXTAREA/.test(a.tagName)}
(async function boot(){
  renderAll();saveState("Connecting…","busy");
  (async()=>{try{S.sample=await window.claude?.use?.("sample")}catch(_){S.sample=null}if(S.sample&&S.tab==="gen")renderMain()})();
  let db=await liveGmBoot();if(!db)return;
  bootSheets(db);
  if(!db){S.dbOk=false;const loc=lsLoad();if(loc)applyFloors(loc);saveState("Saved in this browser","ok");
    $("#main").insertAdjacentHTML("beforebegin",`<div class="banner" id="cloudBanner" style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:220px">Cloud save isn't available in this view, so floors and sheets save to this browser only. Open the Floor Builder from its claude.ai link while signed in, then press Try again. Anything made here will be offered for upload once cloud save connects.</span><button class="btn sm gold" data-act="cloudRetry">Try again</button></div>`);renderAll();return}
  S.db=db;S.dbOk=true;let first=true;
  db.collection("floors").onSnapshot(snap=>{
    const map={};snap.docs.forEach(d=>{if(d.exists)map[d.id]=d.data()});
    if(first){first=false;applyFloors(map);Object.entries(map).forEach(([id,d])=>S.lastSaved[id]=snapKey(d));saveState("Saved","ok");renderAll();setTimeout(()=>offerLocalUpload(map),1500);return}
    let changedCur=false;
    Object.entries(map).forEach(([id,d])=>{if(S.pendingSave[id])return;const js=snapKey(d);if(js===S.lastSaved[id])return;
      const cur=snapKey(S.floors[id]);if(cur===js)return;S.floors[id]=normalize({...d,id});S.lastSaved[id]=js;if(id===S.cur)changedCur=true});
    Object.keys(S.floors).forEach(id=>{if(!map[id]&&!S.pendingSave[id]&&S.lastSaved[id]){delete S.floors[id];if(id===S.cur){S.cur=Object.keys(S.floors)[0]||null;changedCur=true}}});
    renderShell();if(changedCur&&!editing())renderMain();
  },err=>{saveState("Live sync paused — reload to reconnect","err")});
})();
